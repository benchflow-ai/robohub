# robohub: which Robo Use tasks go into which dataset, and which simulator runtime each backend runs on.
# scripts/export.py reads this file and a Robo Use checkout and writes runtimes/ and datasets/;
# scripts/build_registry.py pins every dataset version to a commit in registry.json.

robouse:
  repo: https://github.com/benchflow-ai/robouse
  package_version: 0.1.1

# Simulator runtimes (runtimes/<name>, built from templates/runtimes/<name>). Every task's compose file builds its
# simulator image from one of them.
# Optional per runtime: `assets` ("menagerie", or {file under runtimes/<name>/assets/: pinned-download manifest in the
# Robo Use checkout}), `sim_memory`, `oracle_pip` ({backend: [pip requirement, ...]} installed when the reference
# solution runs) and `oracle_modules` ({backend: module the reference solution imports}).
runtimes:
  base:
    backends: [metaworld, gymrobotics, tabletop]
    simulators: MuJoCo 3.3.0, Meta-World 3.1.1, Gymnasium-Robotics 1.4.2
  menagerie:
    backends: [menagerie, roboharm, drone]
    simulators: MuJoCo 3.3.0, MuJoCo Menagerie models
    assets: menagerie
  robosuite:
    backends: [robosuite]
    simulators: MuJoCo 3.3.0, robosuite 1.5.2
  libero:
    backends: [libero]
    simulators: MuJoCo 3.3.0, LIBERO (hf-libero 0.1.4, robosuite 1.4.0)
    sim_memory: 4G
  dexjoco:
    backends: [dexjoco]
    simulators: MuJoCo 3.4.0, DexJoCo
    sim_memory: 4G
  remix:
    backends: [remix]
    simulators: MuJoCo 3.3.0, MuJoCo Menagerie models
    # native BenchFlow export (`robouse export`): the runtime folder is datasets/runtime-<hash>, content-addressed
    native: true
  behavior:
    backends: [behavior]
    simulators: BEHAVIOR-1K (OmniGibson 3.9.3 on NVIDIA Isaac Sim 5.1), on a remote NVIDIA RTX GPU worker
    gpu: required
    # the simulator runs as remote GPU workers; this runtime holds the thin client and keeps network access (export.py)
    remote_worker: true

# Per-suite facts for the hub page (all simulators run on MuJoCo; "; " separates several values).
suites:
  metaworld: {embodiment: "Sawyer arm", simulator: "Meta-World 3.1.1", image: metaworld}
  gymrobotics: {embodiment: "Fetch arm; point mass", simulator: "Gymnasium-Robotics 1.4.2", image: gymrobotics}
  libero-style: {embodiment: "floating gripper", simulator: "Robo Use tabletop", image: libero-style}
  arc-style: {embodiment: "floating gripper", simulator: "Robo Use tabletop", image: arc-style}
  robo-use-families: {embodiment: "floating gripper", simulator: "Robo Use tabletop", image: robo-use-families}
  safety: {embodiment: "floating gripper", simulator: "Robo Use tabletop", image: safety}
  vision: {embodiment: "floating gripper; Sawyer arm", simulator: "Robo Use tabletop; Meta-World 3.1.1", image: vision}
  hard: {embodiment: "floating gripper", simulator: "Robo Use tabletop", image: hard}
  libero: {embodiment: "Franka Panda", simulator: "LIBERO (robosuite 1.4)", image: libero}
  robosuite: {embodiment: "Franka Panda; UR5e; Kinova Gen3; KUKA IIWA; Sawyer arm", simulator: "robosuite 1.5.2", image: robosuite}
  menagerie: {embodiment: "Franka Panda; ALOHA 2", simulator: "MuJoCo Menagerie models", image: menagerie}
  roboharm: {embodiment: "Franka Panda", simulator: "MuJoCo Menagerie models", image: roboharm}
  drone: {embodiment: "Skydio X2 quadrotor", simulator: "MuJoCo Menagerie models", image: drone}
  dexjoco: {embodiment: "Allegro hands on Franka arms", simulator: "DexJoCo (MuJoCo 3.4.0)", image: dexjoco}
  remix: {embodiment: "Franka Panda; ALOHA 2; PAL TIAGo; Google Robot; Unitree Go2; Crazyflie 2", simulator: "Robo Use remix (MuJoCo Menagerie models)", image: remix}
  behavior: {embodiment: "Galaxea R1Pro mobile manipulator", simulator: "BEHAVIOR-1K (OmniGibson on Isaac Sim 5.1)", image: behavior}

# Datasets are named <org>/<name>. The org is whoever designed the benchmark's tasks: a dataset adapted from someone
# else's benchmark goes under that benchmark's GitHub org (lowercased) and records it under `upstream`; tasks BenchFlow
# designed, even on someone else's simulator or robot models, go under benchflow/. `dir` is the folder under datasets/.
# `aliases` are older names of the same version: registry.json lists each alias as its own entry with the same pinned
# tasks, so existing `bench eval run -d OLD@VERSION` commands keep working; the hub page does not show them.
datasets:
  - name: benchflow/robouse-core
    dir: robouse-core
    aliases: [robouse-core]
    version: "0.1"
    tasks_file: core.txt
    image: vision
    description: "Robo Use core 0.1: 100 tasks sampled across all 14 suites (manipulation, rule inference, vision, safety, dexterous hands, drones), for a quick representative run."
  - name: farama-foundation/metaworld
    dir: robouse-metaworld
    aliases: [robouse-metaworld]
    upstream: {benchmark: "Meta-World", org_name: "Farama Foundation", repo: "https://github.com/Farama-Foundation/Metaworld", licence: MIT}
    version: "0.1"
    suites: [metaworld]
    description: "Robo Use Meta-World 0.1: the 50 Meta-World MT50 manipulation tasks (Sawyer arm), judged by Meta-World's own success signal."
  - name: farama-foundation/gymnasium-robotics
    dir: robouse-gymrobotics
    aliases: [robouse-gymrobotics]
    upstream: {benchmark: "Gymnasium-Robotics", org_name: "Farama Foundation", repo: "https://github.com/Farama-Foundation/Gymnasium-Robotics", licence: MIT}
    version: "0.1"
    suites: [gymrobotics]
    description: "Robo Use Gymnasium-Robotics 0.1: Fetch reach, push and pick-and-place, and PointMaze, 12 tasks."
  - name: benchflow/robouse-tabletop
    dir: robouse-tabletop
    aliases: [robouse-tabletop]
    version: "0.1"
    suites: [arc-style, libero-style, robo-use-families, safety, hard, vision]
    image: arc-style
    description: "Robo Use tabletop 0.1: Robo Use's own MuJoCo tabletop scenes: ARC-style rule inference, LIBERO-like tasks, Robo Use task families, harmful/benign safety pairs, hard low-level control and camera-only vision variants, 119 tasks."
  - name: lifelong-robot-learning/libero
    dir: robouse-libero
    aliases: [robouse-libero]
    upstream: {benchmark: "LIBERO", org_name: "Lifelong Robot Learning", repo: "https://github.com/Lifelong-Robot-Learning/LIBERO", licence: MIT}
    version: "0.1"
    suites: [libero]
    description: "Robo Use LIBERO 0.1: 20 LIBERO tasks (5 each from spatial, object, goal and LIBERO-10) on a Franka Panda, judged by LIBERO's BDDL goal check."
  - name: arise-initiative/robosuite
    dir: robouse-robosuite
    aliases: [robouse-robosuite]
    upstream: {benchmark: "robosuite", org_name: "ARISE Initiative", repo: "https://github.com/ARISE-Initiative/robosuite", licence: MIT}
    version: "0.1"
    suites: [robosuite]
    description: "Robo Use robosuite 0.1: 21 robosuite 1.5 tasks on five arm models, one or two arms, judged by robosuite's own success check."
  - name: benchflow/robouse-menagerie
    dir: robouse-menagerie
    aliases: [robouse-menagerie]
    version: "0.1"
    suites: [menagerie]
    description: "Robo Use Menagerie 0.1: 15 tasks for a dual Franka Panda and ALOHA 2 built from MuJoCo Menagerie models."
  - name: brave-eai/dexjoco
    dir: robouse-dexjoco
    aliases: [robouse-dexjoco]
    upstream: {benchmark: "DexJoCo", org_name: "brave-eai", repo: "https://github.com/brave-eai/dexjoco", licence: MIT}
    version: "0.1"
    suites: [dexjoco]
    description: "Robo Use DexJoCo 0.1: 14 dexterous tool-use tasks with Allegro hands (watering, hammering, tongs, bimanual assembly), from DexJoCo."
  - name: benchflow/robouse-drone
    dir: robouse-drone
    aliases: [robouse-drone]
    version: "0.1"
    suites: [drone]
    description: "Robo Use drone 0.1: 10 Skydio X2 flight tasks over a small town (landing, waypoints, inspection, delivery, privacy)."
  - name: benchflow/robouse-roboharm
    dir: robouse-roboharm
    aliases: [robouse-roboharm]
    version: "0.1"
    suites: [roboharm]
    description: "Robo Use RoboHarm 0.1: 10 harm scenarios x harmful/benign x 4 configurations (raw, guardrail, honeypot, both), 80 tasks on a Franka Panda."
  - name: stanfordvl/behavior-1k
    dir: behavior-1k
    upstream: {benchmark: "BEHAVIOR-1K", org_name: "Stanford Vision and Learning Lab", repo: "https://github.com/StanfordVL/BEHAVIOR-1K", licence: MIT}
    version: "0.1"
    suites: [behavior]
    # bench cannot give a sandbox a GPU (its Daytona sandboxes have none), so this dataset runs from a Robo Use checkout
    # against BEHAVIOR simulator workers on an NVIDIA RTX GPU machine
    run:
      label: "Robo Use checkout + GPU worker"
      command: "robouse run-many --tasks tasks/behavior --harness oracle --out runs/behavior-oracle"
      note: "GPU required. The BEHAVIOR simulator (OmniGibson 3.9.3 on Isaac Sim 5.1) needs an NVIDIA RTX GPU with RT cores and host driver 580 (Isaac Sim 5.1 crashed at start-up on driver 595). Start one simulator worker per activity on the GPU machine, write their endpoints to <code>runs/_behavior/remote.json</code> in a Robo Use checkout (branch <code>behavior-expand</code>), and run from that checkout; the setup is in <a href=\"https://github.com/benchflow-ai/robouse/blob/behavior-expand/docs/suites/behavior.md\">docs/suites/behavior.md</a>. Every task in this dataset was checked this way with the reference solutions and a no-op control."
      bench_note: "Not checked on this dataset: bench has no GPU sandbox. The packages expect the worker endpoints file in <code>$ROBOUSE_BEHAVIOR_REMOTE</code> on the host."
    description: "Robo Use BEHAVIOR-1K 0.1: 43 tasks from 30 household activities of the 2026 BEHAVIOR Challenge (5 extra instances, 8 vision-only) on a Galaxea R1Pro, driven through symbolic skills and judged by BEHAVIOR's BDDL goal check. Needs an NVIDIA RTX GPU for the simulator worker."
  - name: benchflow/robouse-remix
    dir: robouse-remix
    version: "0.1"
    suites: [remix]
    description: "Robo Use remix 0.1: 48 tasks composed from components (6 embodiments: arm, bimanual rig, two mobile manipulators, quadruped, drone; 6 scenes; 9 task templates) with modifiers (vision, noise, perturbations, safety overlays, roles). Each was accepted by robouse remix: the reference solution scores 1 and a no-op agent 0."
  - name: benchflow/robouse-noop-control
    dir: robouse-noop-control
    aliases: [robouse-noop-control]
    version: "0.1"
    noop_of: benchflow/robouse-core
    image: vision
    description: "Negative control for robouse-core 0.1: the same 100 tasks, but each reference solution only looks (robo info, robo observe) and exits without moving the robot. Run it with the oracle agent; every task must score 0."
