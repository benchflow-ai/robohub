# robohub: which Robo Use tasks go into which dataset, and which simulator runtime each backend runs on.
# scripts/export.py reads this file and a Robo Use checkout and writes runtimes/ and datasets/;
# scripts/build_registry.py pins every dataset version to a commit in registry.json.

# The Robo Use release the next export comes from (scripts/export.py refuses a checkout of another version).
# export.json records the release each dataset was exported from: rle-bench/rle-bench and capgym/cap-x from 0.3.0,
# every other dataset from 0.2.0.
robouse:
  repo: https://pypi.org/project/robouse/0.3.0/
  package_version: 0.3.0

# Simulator runtimes (runtimes/<name>, built from templates/runtimes/<name>). Every task's compose file builds its
# simulator image from one of them.
# Optional per runtime: `assets` ("menagerie", or {file under runtimes/<name>/assets/: pinned-download manifest in the
# Robo Use checkout}), `sim_memory`, `oracle_pip` ({backend: [pip requirement, ...]} installed when the reference
# solution runs) and `oracle_modules` ({backend: module the reference solution imports}).
runtimes:
  base:
    backends: [metaworld, gymrobotics, tabletop, kitchen, adroit]
    simulators: MuJoCo 3.3.0, Meta-World 3.1.1, Gymnasium-Robotics 1.4.2
  light:
    backends: [nav, cubepick]
    simulators: numpy-only (Robo Use navigation homes, inspect-robots CubePick)
  menagerie:
    backends: [menagerie, roboharm, drone]
    simulators: MuJoCo 3.3.0, MuJoCo Menagerie models
    assets: menagerie
  robosuite:
    backends: [robosuite]
    simulators: MuJoCo 3.3.0, robosuite 1.5.2
  libero:
    backends: [libero]
    simulators: MuJoCo 3.3.0, LIBERO (hf-libero 0.1.4, robosuite 1.4.0)
    sim_memory: 4G
  dexjoco:
    backends: [dexjoco]
    simulators: MuJoCo 3.4.0, DexJoCo
    sim_memory: 4G
  embodied:
    backends: [quadruped, humanoid, mobile_manip, dexhand, crazyflie]
    simulators: MuJoCo 3.3.0, MuJoCo Menagerie models
    assets: {embodiments.json: assets/menagerie/embodiments.json}
    oracle_pip: {humanoid: [mujoco==3.3.0]}
  driving:
    backends: [driving]
    simulators: MetaDrive 0.4.3
  dmcontrol:
    backends: [dmcontrol]
    simulators: MuJoCo 3.14.0, dm_control 1.0.47
    sim_memory: 2G
  myosuite:
    backends: [myosuite]
    simulators: MuJoCo 3.6.0, MyoSuite 2.12.2
    sim_memory: 2G
  humanoidbench:
    backends: [humanoidbench]
    simulators: MuJoCo 3.1.6, HumanoidBench (commit cb11890)
    assets: {humanoidbench.json: assets/humanoidbench/provenance.json}
    sim_memory: 2G
  maniskill:
    backends: [maniskill]
    simulators: ManiSkill3 3.0.1 on SAPIEN 3.0.3 (CPU physics, lavapipe rendering)
    sim_memory: 4G
  robocasa:
    backends: [robocasa]
    simulators: MuJoCo 3.3.1, RoboCasa365 (robosuite 1.5.2)
    assets: {robocasa.json: assets/robocasa/provenance.json}
    sim_memory: 4G
  composed:
    backends: [components]
    simulators: MuJoCo 3.3.0, MuJoCo Menagerie models
    # written by Robo Use's own exporter (robouse.engine.format, on BenchFlow's embodied layer); see scripts/export.py
    native: true
  behavior:
    backends: [behavior]
    simulators: BEHAVIOR-1K (OmniGibson 3.9.3 on NVIDIA Isaac Sim 5.1), on a remote NVIDIA RTX GPU worker
    gpu: required
    # the simulator runs as remote GPU workers; this runtime holds the thin client and keeps network access (export.py)
    remote_worker: true
  gpu:
    backends: [gpu]
    simulators: ManiSkill3 3.0.1, Genesis 1.4.2, MuJoCo Playground 0.2.0, Isaac Lab 2.3 on Isaac Sim 5.1, on a remote NVIDIA RTX GPU worker
    gpu: required
    # remote GPU workers (robouse/backends/gpu/worker/server.py, one per simulator); the endpoints file is named by $ROBOUSE_GPU_REMOTE
    remote_worker: ROBOUSE_GPU_REMOTE
  rlebench:
    backends: [rlebench]
    simulators: RLE-Bench scenes (34a73aa) on robosuite 5ce6643 and RoboCasa v1.0.1, MuJoCo 3.3.1
    sim_memory: 4G
  capx:
    backends: [capx]
    simulators: CaP-X (53e9966) on its robosuite 1.5.1 fork (97292732), MuJoCo 3.5.0, PyRoKi IK on the CPU
    sim_memory: 4G
    # CaP-X's reference code for the nut assembly and the two-arm lift imports scipy
    oracle_pip: {capx: [scipy==1.18.1]}
  capx-libero:
    backends: [capx_libero]
    simulators: CaP-X (53e9966) on LIBERO-PRO (5368540) and its robosuite 1.4 fork (a498b08), MuJoCo 3.5.0, PyRoKi IK on the CPU
    sim_memory: 4G
  robodojo:
    backends: [robodojo]
    simulators: RoboDojo (NVIDIA Isaac Sim 5.1, Isaac Lab 2.3), on a remote NVIDIA RTX GPU worker
    gpu: required
    # remote GPU workers (robodojo_worker.py); the endpoints file is named by $ROBOUSE_ROBODOJO_REMOTE on the host
    remote_worker: ROBOUSE_ROBODOJO_REMOTE

