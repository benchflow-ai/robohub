# Datasets are named <org>/<name>. The org is whoever designed the benchmark's tasks: a dataset adapted from someone
# else's benchmark goes under that benchmark's GitHub org (lowercased) and records it under `upstream`; tasks BenchFlow
# designed, even on someone else's simulator or robot models, go under benchflow/. `dir` is the folder under datasets/.
# `former_names` are older names of the dataset. Their registry.json entries (earlier versions, pinned to earlier commits)
# stay, so existing `bench eval run -d OLD@VERSION` commands keep working; new versions are published only under `name`,
# and the hub page does not show the old names.
datasets:
  - name: benchflow/robouse-core
    dir: robouse-core
    former_names: [robouse-core]
    version: "0.4"
    tasks_file: core.txt
    image: vision
    description: 'Robo Use core 0.4: a cross-section of every Robo Use suite.'
  - name: farama-foundation/metaworld
    dir: robouse-metaworld
    former_names: [robouse-metaworld]
    upstream: {benchmark: "Meta-World", org_name: "Farama Foundation", repo: "https://github.com/Farama-Foundation/Metaworld", licence: MIT}
    version: "0.3"
    suites: [metaworld]
    description: 'Robo Use Meta-World 0.3: Meta-World MT50 manipulation on a Sawyer arm.'
  - name: farama-foundation/gymnasium-robotics
    dir: robouse-gymrobotics
    former_names: [robouse-gymrobotics]
    upstream: {benchmark: "Gymnasium-Robotics", org_name: "Farama Foundation", repo: "https://github.com/Farama-Foundation/Gymnasium-Robotics", licence: MIT}
    version: "0.3"
    suites: [gymrobotics]
    description: 'Robo Use Gymnasium-Robotics 0.3: Fetch reach, push and pick-and-place, and PointMaze.'
  - name: benchflow/robouse-tabletop
    dir: robouse-tabletop
    former_names: [robouse-tabletop]
    version: "0.3"
    suites: [arc-style, libero-style, robo-use-families, safety, hard, vision]
    image: arc-style
    description: 'Robo Use tabletop 0.3: Robo Use''s own tabletop scenes: rule inference, safety, vision and low-level control.'
  - name: lifelong-robot-learning/libero
    dir: robouse-libero
    former_names: [robouse-libero]
    upstream: {benchmark: "LIBERO", org_name: "Lifelong Robot Learning", repo: "https://github.com/Lifelong-Robot-Learning/LIBERO", licence: "MIT (code); CC BY 4.0 (datasets; demonstration actions redistributed here)"}
    version: "0.4"
    suites: [libero]
    description: 'Robo Use LIBERO 0.4: LIBERO''s four standard suites on a Franka Panda.'
  - name: arise-initiative/robosuite
    dir: robouse-robosuite
    former_names: [robouse-robosuite]
    upstream: {benchmark: "robosuite", org_name: "ARISE Initiative", repo: "https://github.com/ARISE-Initiative/robosuite", licence: MIT}
    version: "0.3"
    suites: [robosuite]
    description: 'Robo Use robosuite 0.3: tasks from robosuite 1.5 on five arm models.'
  - name: benchflow/robouse-menagerie
    dir: robouse-menagerie
    former_names: [robouse-menagerie]
    version: "0.3"
    suites: [menagerie]
    description: 'Robo Use Menagerie 0.3: two-arm tasks for a dual Franka Panda and ALOHA 2.'
  - name: brave-eai/dexjoco
    dir: robouse-dexjoco
    former_names: [robouse-dexjoco]
    upstream: {benchmark: "DexJoCo", org_name: "brave-eai", repo: "https://github.com/brave-eai/dexjoco", licence: "MIT (code and datasets; demonstration actions redistributed here)"}
    version: "0.3"
    suites: [dexjoco]
    description: 'Robo Use DexJoCo 0.3: tool use with Allegro hands, from DexJoCo.'
  - name: benchflow/robouse-drone
    dir: robouse-drone
    former_names: [robouse-drone]
    version: "0.3"
    suites: [drone]
    description: 'Robo Use drone 0.3: Skydio X2 flights over a small town.'
  - name: benchflow/robouse-harm
    dir: robouse-harm
    former_names: [benchflow/robouse-roboharm, robouse-roboharm]
    version: "0.3"
    suites: [roboharm]
    description: 'Robo Use harm 0.3: harmful and benign requests to a Franka Panda, BenchFlow''s reproduction of Robocurve''s RoboHarm.'
  - name: benchflow/quadruped
    dir: robouse-quadruped
    version: "0.3"
    suites: [quadruped]
    description: 'Robo Use quadruped 0.3: Unitree, Boston Dynamics and ANYbotics quadrupeds walking, pushing and docking.'
  - name: benchflow/humanoid
    dir: robouse-humanoid
    version: "0.3"
    suites: [humanoid]
    description: 'Robo Use humanoid 0.3: humanoids on support stands doing tabletop tasks.'
  - name: benchflow/mobile-manip
    dir: robouse-mobile-manip
    version: "0.3"
    suites: [mobile-manip]
    description: 'Robo Use mobile manipulation 0.3: fetch, stow and sort in a three-room apartment.'
  - name: benchflow/dexhand
    dir: robouse-dexhand
    version: "0.3"
    suites: [dexhand]
    description: 'Robo Use dexterous hands 0.3: in-hand manipulation with the Shadow Hand and LEAP Hand.'
  - name: benchflow/crazyflie
    dir: robouse-crazyflie
    version: "0.3"
    suites: [crazyflie]
    description: 'Robo Use Crazyflie 0.3: indoor flights for Crazyflie 2 quadrotors, alone and in a swarm.'
  - name: benchflow/driving
    dir: robouse-driving
    version: "0.3"
    suites: [driving]
    description: 'Robo Use driving 0.3: traffic scenarios for a sedan on MetaDrive roads.'
  - name: lifelong-robot-learning/libero-90
    dir: robouse-libero-90
    upstream: {benchmark: LIBERO, org_name: Lifelong Robot Learning, repo: 'https://github.com/Lifelong-Robot-Learning/LIBERO', licence: "MIT (code); CC BY 4.0 (datasets; demonstration actions redistributed here)"}
    version: "0.3"
    suites: [libero-90]
    description: 'Robo Use LIBERO-90 0.3: LIBERO-90''s short-horizon household tasks on a Franka Panda.'
  - name: farama-foundation/franka-kitchen
    dir: robouse-kitchen
    upstream: {benchmark: Franka Kitchen (Gymnasium-Robotics; Relay Policy Learning / D4RL kitchen), org_name: Farama Foundation, repo: 'https://github.com/Farama-Foundation/Gymnasium-Robotics', licence: MIT (code); Apache-2.0 (kitchen and Franka assets)}
    version: "0.3"
    suites: [kitchen]
    description: 'Robo Use Franka Kitchen 0.3: FrankaKitchen-v1 subtasks and goal sets on a Franka Panda.'
  - name: farama-foundation/adroit-hand
    dir: robouse-adroit
    upstream: {benchmark: Adroit hand (Gymnasium-Robotics; DAPG), org_name: Farama Foundation, repo: 'https://github.com/Farama-Foundation/Gymnasium-Robotics', licence: MIT (code); Apache-2.0 (ADROIT assets); CC BY 4.0 (D4RL demonstrations; action sequences redistributed here)}
    version: "0.3"
    suites: [adroit]
    description: 'Robo Use Adroit hand 0.3: door, hammer, pen and relocation tasks with the ADROIT hand.'
  - name: google-deepmind/dm-control
    dir: robouse-dmcontrol
    upstream: {benchmark: dm_control (DeepMind Control Suite and dm_control.manipulation), org_name: Google DeepMind, repo: 'https://github.com/google-deepmind/dm_control', licence: Apache-2.0}
    version: "0.3"
    suites: [dmcontrol]
    description: 'Robo Use dm_control 0.3: Control Suite bodies and a Kinova Jaco arm from dm_control.'
  - name: myohub/myosuite
    dir: robouse-myosuite
    upstream: {benchmark: MyoSuite, org_name: MyoHub, repo: 'https://github.com/MyoHub/myosuite', licence: "Apache-2.0 (code, models and NPG baseline policies; three policies redistributed here, converted to JSON)"}
    version: "0.3"
    suites: [myosuite]
    description: 'Robo Use MyoSuite 0.3: muscle-driven human arm and hand models from MyoSuite.'
  - name: carlosferrazza/humanoid-bench
    dir: robouse-humanoidbench
    upstream: {benchmark: HumanoidBench, org_name: 'Carmelo Sferrazza (UC Berkeley)', repo: 'https://github.com/carlosferrazza/humanoid-bench', licence: MIT}
    version: "0.3"
    suites: [humanoidbench]
    description: 'Robo Use HumanoidBench 0.3: whole-body tasks for a Unitree H1 with two Shadow hands.'
  - name: mani-skill/maniskill
    dir: robouse-maniskill
    upstream: {benchmark: ManiSkill3, org_name: Hao Su Lab (UC San Diego) and Hillbot, repo: 'https://github.com/mani-skill/ManiSkill', licence: "Apache-2.0 (code); CC BY-NC 4.0 (assets, not redistributed)"}
    version: "0.3"
    suites: [maniskill]
    description: 'Robo Use ManiSkill3 0.3: ManiSkill3 tabletop manipulation on a Franka Panda.'
  - name: robocasa/robocasa
    dir: robouse-robocasa
    upstream: {benchmark: RoboCasa, org_name: RoboCasa, repo: 'https://github.com/robocasa/robocasa', licence: "MIT (code); CC BY 4.0 (assets and datasets)"}
    version: "0.3"
    suites: [robocasa]
    description: 'Robo Use RoboCasa 0.3: RoboCasa kitchen tasks in ten layouts, on a Franka Panda on a mobile base.'
  - name: stanfordvl/behavior-1k
    dir: behavior-1k
    upstream: {benchmark: "BEHAVIOR-1K", org_name: "Stanford Vision and Learning Lab", repo: "https://github.com/StanfordVL/BEHAVIOR-1K", licence: "MIT (code and BDDL); BEHAVIOR Data Bundle under its own non-commercial licence (not redistributed)"}
    version: "0.3"
    suites: [behavior]
    # bench cannot give a sandbox a GPU, so this dataset runs with Robo Use
    # against BEHAVIOR simulator workers on an NVIDIA RTX GPU machine
    run:
      label: "Robo Use + GPU worker"
      command: "robouse run-many --tasks tasks/behavior --harness oracle --out runs/behavior-oracle"
      note: "Needs BEHAVIOR-1K simulator workers (OmniGibson 3.9.3 on NVIDIA Isaac Sim 5.1, with the BEHAVIOR Data Bundle), one per activity, on an NVIDIA RTX GPU with RT cores and a driver from the 580 branch (Isaac Sim 5.1 crashed at start-up on 595). The command above is the Robo Use run that checked every task with the reference solutions and a no-op control; it uses the task folders of a Robo Use source checkout. Requirements: <a href=\"https://github.com/benchflow-ai/robohub#gpu-datasets\">GPU datasets in the robohub README</a>."
      bench_note: "Not run in the hub's checks (its packages passed bench tasks check only). With bench, the host names the worker endpoints file in <code>$ROBOUSE_BEHAVIOR_REMOTE</code>."
    description: 'Robo Use BEHAVIOR-1K 0.3: household activities from the 2026 BEHAVIOR Challenge on a Galaxea R1Pro.'
  - name: benchflow/robouse-composed
    dir: robouse-composed
    former_names: [benchflow/robouse-remix]
    version: "0.4"
    suites: [composed]
    description: 'Robo Use composed 0.4: tasks composed from embodiments, scenes, task templates and modifiers.'
  - name: benchflow/robouse-nav
    dir: robouse-nav
    version: "0.3"
    suites: [nav]
    description: 'Robo Use navigation 0.3: drive a mobile base to a named piece of furniture in generated homes.'
  - name: robocurve/cubepick-reach
    dir: robouse-cubepick
    upstream: {benchmark: "inspect-robots cubepick-reach", org_name: "Robocurve", repo: "https://github.com/robocurve/inspect-robots", licence: MIT}
    version: "0.3"
    suites: [cubepick]
    description: 'Robo Use CubePick 0.3: the reach-the-cube world from inspect-robots.'
  - name: haosulab/maniskill-gpu
    dir: maniskill-gpu
    upstream: {benchmark: "ManiSkill3", org_name: "Hao Su Lab (UC San Diego) and Hillbot", repo: "https://github.com/mani-skill/ManiSkill", licence: "Apache-2.0 (code); CC BY-NC 4.0 (assets, not redistributed)"}
    version: "0.3"
    suites: [gpu-maniskill]
    run:
      label: "Robo Use + GPU worker"
      command: "robouse run-many --tasks tasks/gpu-maniskill --harness oracle --out runs/gpu-maniskill-oracle"
      note: "Needs GPU simulator workers (<code>robouse/backends/gpu/worker/server.py</code> in the Robo Use package, one per simulator: ManiSkill3 3.0.1, Genesis 1.4.2, MuJoCo Playground 0.2.0, Isaac Lab 2.3 on Isaac Sim 5.1) on an NVIDIA RTX GPU machine; Isaac Lab ran without its RTX renderer on driver 595. The command above is the Robo Use run that checked every task with the reference solutions and a no-op control; it uses the task folders of a Robo Use source checkout. Requirements: <a href=\"https://github.com/benchflow-ai/robohub#gpu-datasets\">GPU datasets in the robohub README</a>."
      bench_note: "Not run in the hub's checks (its packages passed bench tasks check only). With bench, the host names the worker endpoints file in <code>$ROBOUSE_GPU_REMOTE</code>."
    description: 'Robo Use ManiSkill3 GPU 0.3: hard ManiSkill3 tasks with ray-traced cameras, on a Franka Panda.'
  - name: benchflow/robouse-genesis
    dir: robouse-genesis
    version: "0.3"
    suites: [gpu-genesis]
    run:
      label: "Robo Use + GPU worker"
      command: "robouse run-many --tasks tasks/gpu-genesis --harness oracle --out runs/gpu-genesis-oracle"
      note: "Needs GPU simulator workers (<code>robouse/backends/gpu/worker/server.py</code> in the Robo Use package, one per simulator: ManiSkill3 3.0.1, Genesis 1.4.2, MuJoCo Playground 0.2.0, Isaac Lab 2.3 on Isaac Sim 5.1) on an NVIDIA RTX GPU machine; Isaac Lab ran without its RTX renderer on driver 595. The command above is the Robo Use run that checked every task with the reference solutions and a no-op control; it uses the task folders of a Robo Use source checkout. Requirements: <a href=\"https://github.com/benchflow-ai/robohub#gpu-datasets\">GPU datasets in the robohub README</a>."
