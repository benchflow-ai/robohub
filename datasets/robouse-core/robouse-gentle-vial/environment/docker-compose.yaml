# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "b7916617ffb17903f86775e8cff7fa80"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/robouse-gentle-vial
          description: Gentle placement of a fragile vial
        metadata:
          source_benchmark: BenchFlow robo-use (task family, adapted to a single floating gripper)
          source_task: D03 Gentle Insertion (force/impact-limited handling)
          source_suite: robo-use D-family
          suite: robo-use-families
          category: gentle
          difficulty: medium
          tags:
          - robo-use
          - fragile
          - speed-limit
        agent:
          timeout_sec: 900
        verifier:
          timeout_sec: 120
        robouse:
          id: robouse-gentle-vial
          backend: tabletop
          seed: 0
          max_steps: 700
          camera: front
          skills: true
          success_mode: final
          scenario:
            id: robouse-gentle-vial
            title: Gentle placement of a fragile vial
            goal: Move the fragile white vial onto the blue pad and leave it standing upright (tilt under 10 degrees). The vial must never move downward faster than 0.2 m/s (about 0.4 cm per step), which the server measures at every step; dropping it even from a few millimetres breaks this limit. Violations are reported in `constraint_violations`.
            objects:
            - name: vial
              kind: cyl
              color: white
              pos:
              - -0.12
              - -0.05
              size:
              - 0.015
              - 0.03
            fixtures:
            - name: blue_pad
              kind: pad
              pos:
              - 0.12
              - 0.08
              size:
              - 0.035
              - 0.035
              color: blue
            constraints:
            - type: max_down_speed
              object: vial
              limit: 0.2
            goals:
            - type: on_pad
              obj: vial
              pad: blue_pad
              max_tilt: 10
            max_steps: 700
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "1800"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
