# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:87e23e31c6fe17e7471455c898823b931712dd1c4c4fd10395e8efa27a437014"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "2b9bc12675e06f785bc7108e12b50099"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-wrist-find-red-cube
          description: Find the red cube with the wrist camera
        metadata:
          source_benchmark: robouse original
          source_task: find an object by colour and shape
          source_suite: hard
          suite: hard
          category: active-perception
          difficulty: hard
          tags:
          - wrist-camera-only
          - no-object-coordinates
          - no-calibrated-world-camera
          - search
          - distractors
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-wrist-find-red-cube
          backend: tabletop
          seed: 0
          max_steps: 550
          camera: front
          skills: true
          success_mode: final
          obs_mode: vision
          cameras:
          - wrist
          uncalibrated_cameras:
          - wrist
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-wrist-find-red-cube
            title: Find the red cube with the wrist camera
            goal: 'Somewhere on the table is exactly one red cube (a box about 4 cm wide). Find it and put it into the white bowl, whose centre is at x = 0.20, y = 0.15 (inner diameter 12 cm, rim 3.5 cm high). Other objects on the table are distractors: some have a similar colour or the same colour but a different shape; leave them alone (they are not judged).'
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - -0.22
              - -0.18
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_2
              kind: cyl
              color: red
              pos:
              - 0.13
              - -0.06
              size:
              - 0.02
              - 0.02
            - name: item_3
              kind: box
              color: orange
              pos:
              - 0.04
              - 0.1
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_4
              kind: box
              color: pink
              pos:
              - -0.1
              - 0.03
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_5
              kind: box
              color: blue
              pos:
              - 0.26
              - -0.2
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_6
              kind: cyl
              color: green
              pos:
              - -0.25
              - 0.16
              size:
              - 0.02
              - 0.03
            - name: item_7
              kind: cyl
              color: orange
              pos:
              - -0.02
              - -0.16
              size:
              - 0.018
              - 0.02
            fixtures:
            - name: bowl
              kind: bowl
              pos:
              - 0.2
              - 0.15
              radius: 0.06
              color: white
            goals:
            - type: in
              obj: item_1
              container: bowl
            constraints: []
            wrist_camera: true
            max_steps: 550
            camera: front
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
