          - 0.0
          - 0.0
          - 0.0
          - 0.0
          - 0.263
          - 0.0
          - 0.0
          - 0.0
          - -0.290095
          - 0.1615649
          - 1.0279832
          - 0.3021435
          - -0.6393037
