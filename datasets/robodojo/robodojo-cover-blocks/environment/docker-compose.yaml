# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/robodojo"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:cbddb5b2d8b4cccf3291330183e707e02f020bff0d64793d84bb9c351ceacdfa"
    # This runtime's simulator runs on a remote GPU worker (remote_worker in hub.yaml): the episode server reaches it
    # over HTTPS, so this service keeps network access, and it reads the worker endpoints (URL, shared secret) from
    # the host file named by $ROBOUSE_ROBODOJO_REMOTE, mounted read-only here only; the agent container never sees it.
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
      - ${ROBOUSE_ROBODOJO_REMOTE:?set ROBOUSE_ROBODOJO_REMOTE to the ROBODOJO worker endpoints file}:/run/robouse/remote.json:ro
    environment:
      ROBOUSE_ROBODOJO_REMOTE: /run/robouse/remote.json
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "c1560a33476c327a75d18e76d66a451f"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/robodojo-cover-blocks
          description: Cover the blocks left to right, then uncover them red, green, blue (RoboDojo cover_blocks, ARX X5 bimanual, Isaac Sim 5.1).
        metadata:
          source_benchmark: RoboDojo (RoboDojo-Benchmark/RoboDojo @ 726e9aa; Isaac Sim 5.1, Isaac Lab 2.3)
          source_task: cover_blocks
          suite: robodojo
          category: manipulation
          difficulty: hard
          tags:
          - isaac-sim
          - robodojo
          - arx-x5
          - bimanual
          - tabletop
          - memory
          - memory
          - sequencing
          - pick-place
          embodiment: arx_x5_bimanual
          scenario: robodojo-tabletop
          capability: memory
          capabilities:
          - memory
          - sequencing
          - pick-place
          success_rule: RoboDojo cover_blocks run_reward() reaches 1 within step_lim
          reference_solution: 'scripted plan through robo skills: carry the cup in front of each block onto it, left to right; then carry the cups back, red, green, blue'
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: robodojo-cover-blocks
          backend: robodojo
          env: cover_blocks
          seed: 0
          max_steps: 800
          camera: cam_head
          cameras:
          - cam_head
          - cam_left_wrist
          - cam_right_wrist
          skills: true
          success_mode: first
          obs_mode: state
          frame_every: 4
          ready_timeout_s: 900
          rpc_timeout_s: 300
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
