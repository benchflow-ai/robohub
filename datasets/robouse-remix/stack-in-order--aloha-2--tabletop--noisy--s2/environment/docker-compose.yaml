# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "b78c5fd5e09d84d03e56acd2dbbaa0e1"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/stack-in-order--aloha-2--tabletop--noisy--s2
          description: 'Stack blocks in a stated order: ALOHA 2 in the tabletop'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: stack-in-order--aloha-2--tabletop--noisy--s2
          suite: remix
          category: stack-in-order
          difficulty: medium
          tags:
          - remix
          - aloha-2
          - tabletop
          - tabletop
          - arm
          - spatial-reasoning
          - pick-and-place
          embodiment: aloha-2
          scene: tabletop
          scenario: tabletop
          track: arm
          capabilities:
          - spatial-reasoning
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 956
        agent:
          timeout_sec: 2100
        verifier:
          timeout_sec: 120
        robouse:
          id: stack-in-order--aloha-2--tabletop--noisy--s2
          backend: remix
          env: stack-in-order--aloha-2--tabletop--noisy--s2
          seed: 2
          max_steps: 1400
          camera: front
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - front
          - top
          skills: true
          success_mode: final
          components:
            embodiment: aloha-2@0.1.0
            scene: tabletop@0.1.0
            task: stack-in-order@0.1.0
            modifiers:
              obs: noisy
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: aloha-2
            scene: tabletop
            task: stack-in-order
            seed: 2
            modifiers:
              obs: noisy
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: yellow_block
                kind: block
                color: yellow
                pos:
                - -0.323
                - -0.019
                - 0.75
                yaw: 1.494375906730272
                'on': table
              - name: green_block
                kind: block
                color: green
                pos:
                - 0.243
                - -0.065
                - 0.75
                yaw: 3.1964255825787937
                'on': table
              - name: purple_block
                kind: block
                color: purple
                pos:
                - 0.671
                - -0.013
                - 0.75
                yaw: -2.601004006079372
                'on': table
              fixtures:
              - name: base_mark
                kind: zone
                color: black
                pos:
                - -0.531
                - -0.03
                - 0.75
                half:
                - 0.045
                - 0.045
                'on': table
              goal:
                order:
                - yellow_block
                - purple_block
                - green_block
                mark: base_mark
                object: yellow_block
              task: 'Build a tower of the three blocks on the black mark: the yellow block at the bottom, the green block on top, and the remaining block in the middle.'
              success: the bottom block rests on the surface with its centre on the black mark (within 3 cm), each other block rests on the one below it (centres within 2.5 cm horizontally, touching), every block is level (tilted less than 15 degrees) and the robot touches none of them
              steps: 1400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
