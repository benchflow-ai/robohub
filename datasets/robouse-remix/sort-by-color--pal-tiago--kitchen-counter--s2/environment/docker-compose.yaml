# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "52fe53f0db6476ba7ad6ab53c1566538"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/sort-by-color--pal-tiago--kitchen-counter--s2
          description: 'Sort objects into containers by colour: PAL TIAGo in the kitchen counter'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: sort-by-color--pal-tiago--kitchen-counter--s2
          suite: remix
          category: sort-by-color
          difficulty: medium
          tags:
          - remix
          - pal-tiago
          - kitchen-counter
          - household-kitchen
          - mobile-manipulation
          - long-horizon
          - pick-and-place
          embodiment: pal-tiago
          scene: kitchen-counter
          scenario: household-kitchen
          track: mobile-manipulation
          capabilities:
          - long-horizon
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 3394
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: sort-by-color--pal-tiago--kitchen-counter--s2
          backend: remix
          env: sort-by-color--pal-tiago--kitchen-counter--s2
          seed: 2
          max_steps: 4000
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - counter_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: pal-tiago@0.1.0
            scene: kitchen-counter@0.1.0
            task: sort-by-color@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: pal-tiago
            scene: kitchen-counter
            task: sort-by-color
            seed: 2
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: yellow_tall_block_1
                kind: tall_block
                color: yellow
                pos:
                - 0.883
                - -0.746
                - 0.75
                yaw: 3.1964255825787937
                'on': dining_table
              - name: green_can_1
                kind: can
                color: green
                pos:
                - 0.581
                - -1.011
                - 0.75
                yaw: -9.490954597609404
                'on': dining_table
              fixtures:
              - name: yellow_bowl
                kind: bowl
                color: yellow
                pos:
                - 0.546
                - -0.445
                - 0.75
                'on': dining_table
              - name: green_bowl
                kind: bowl
                color: green
                pos:
                - 0.116
                - -0.438
                - 0.75
                'on': dining_table
              goal:
                assign:
                  yellow_tall_block_1: yellow_bowl
                  green_can_1: green_bowl
                object: yellow_tall_block_1
              task: 'Sort the objects by colour: put every yellow object into the yellow bowl and every green object into the green bowl.'
              success: every object rests inside the bowl of its own colour and no part of the robot touches any of them
              steps: 4000
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
