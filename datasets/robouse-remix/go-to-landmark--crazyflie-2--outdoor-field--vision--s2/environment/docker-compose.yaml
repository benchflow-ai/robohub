# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "5105d9bdca4bc2e148c959b1ff3662d7"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/go-to-landmark--crazyflie-2--outdoor-field--vision--s2
          description: 'Go to the mat described by a spatial relation: Bitcraze Crazyflie 2 in the outdoor field'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: go-to-landmark--crazyflie-2--outdoor-field--vision--s2
          suite: remix
          category: go-to-landmark
          difficulty: easy
          tags:
          - remix
          - crazyflie-2
          - outdoor-field
          - outdoor-field
          - aerial
          - spatial-reasoning
          - navigation
          - perception
          - partial-observability
          embodiment: crazyflie-2
          scene: outdoor-field
          scenario: outdoor-field
          track: aerial
          capabilities:
          - spatial-reasoning
          - navigation
          - perception
          - partial-observability
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 441
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: go-to-landmark--crazyflie-2--outdoor-field--vision--s2
          backend: remix
          env: go-to-landmark--crazyflie-2--outdoor-field--vision--s2
          seed: 2
          max_steps: 1200
          camera: chase
          cameras:
          - overview
          - chase
          - robot/fpv
          - top
          skills: true
          success_mode: final
          components:
            embodiment: crazyflie-2@0.1.0
            scene: outdoor-field@0.1.0
            task: go-to-landmark@0.1.0
            modifiers:
              obs: vision
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: crazyflie-2
            scene: outdoor-field
            task: go-to-landmark
            seed: 2
            modifiers:
              obs: vision
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects: []
              fixtures:
              - name: yellow_pad
                kind: pad
                color: yellow
                pos:
                - 2.373
                - -1.053
                - 0.0
                half:
                - 0.2
                - 0.2
                'on': floor
              - name: green_pad
                kind: pad
                color: green
                pos:
                - 2.699
                - 1.26
                - 0.0
                half:
                - 0.2
                - 0.2
                'on': floor
              - name: red_pad
                kind: pad
                color: red
                pos:
                - -1.375
                - -1.2
                - 0.0
                half:
                - 0.2
                - 0.2
                'on': floor
              goal:
                target: yellow_pad
                landmark: the solar panel array
              task: Three coloured landing pads lie on the floor. Take off, fly to the pad closest to the solar panel array and land on it. (Closest means the smallest distance between the landing pad's centre and the centre of the solar panel array.)
              success: the drone rests on that pad with its motors off (its centre above the pad), and it never touched anything but the floor, a pad or a surface top
              steps: 1200
          obs_mode: vision
          visible_fields:
          - robot
          - scene
          - safety_events
          - time_s
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
