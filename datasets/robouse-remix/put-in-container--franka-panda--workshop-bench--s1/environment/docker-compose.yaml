# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "817d9ec4ef08e9e7958e75f85f038611"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/put-in-container--franka-panda--workshop-bench--s1
          description: 'Put an object in a container: Franka Emika Panda in the workshop bench'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: put-in-container--franka-panda--workshop-bench--s1
          suite: remix
          category: put-in-container
          difficulty: easy
          tags:
          - remix
          - franka-panda
          - workshop-bench
          - workshop-assembly
          - arm
          - pick-and-place
          embodiment: franka-panda
          scene: workshop-bench
          scenario: workshop-assembly
          track: arm
          capabilities:
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 147
        agent:
          timeout_sec: 1050
        verifier:
          timeout_sec: 120
        robouse:
          id: put-in-container--franka-panda--workshop-bench--s1
          backend: remix
          env: put-in-container--franka-panda--workshop-bench--s1
          seed: 1
          max_steps: 700
          camera: bench_cam
          cameras:
          - overview
          - robot/arm_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: franka-panda@0.1.0
            scene: workshop-bench@0.1.0
            task: put-in-container@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: franka-panda
            scene: workshop-bench
            task: put-in-container
            seed: 1
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: orange_bolt
                kind: bolt
                color: orange
                pos:
                - 0.266
                - 1.082
                - 0.9
                yaw: 1.1902485041534279
                'on': workbench
              - name: red_block
                kind: block
                color: red
                pos:
                - 0.358
                - 1.145
                - 0.9
                yaw: 0.9894445331384212
                'on': workbench
              fixtures:
              - name: tote
                kind: tote
                color: grey
                pos:
                - -0.069
                - 1.085
                - 0.9
                'on': workbench
              goal:
                object: orange_bolt
                container: tote
              task: Put the orange bolt in the grey tote. Leave the other objects where they are.
              success: the orange bolt rests inside the grey tote (its centre within the container's inner footprint and below its rim), no part of the robot touches it, and no other object is inside the grey tote
              steps: 700
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "1950"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
