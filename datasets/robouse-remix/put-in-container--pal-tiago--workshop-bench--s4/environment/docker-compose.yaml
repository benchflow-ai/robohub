# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "1360c58b0f2e07f7bb59d10e7b9897a3"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/put-in-container--pal-tiago--workshop-bench--s4
          description: 'Put an object in a container: PAL TIAGo in the workshop bench'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: put-in-container--pal-tiago--workshop-bench--s4
          suite: remix
          category: put-in-container
          difficulty: easy
          tags:
          - remix
          - pal-tiago
          - workshop-bench
          - workshop-assembly
          - mobile-manipulation
          - pick-and-place
          embodiment: pal-tiago
          scene: workshop-bench
          scenario: workshop-assembly
          track: mobile-manipulation
          capabilities:
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 1197
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: put-in-container--pal-tiago--workshop-bench--s4
          backend: remix
          env: put-in-container--pal-tiago--workshop-bench--s4
          seed: 4
          max_steps: 2400
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - bench_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: pal-tiago@0.1.0
            scene: workshop-bench@0.1.0
            task: put-in-container@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: pal-tiago
            scene: workshop-bench
            task: put-in-container
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: blue_tall_block
                kind: tall_block
                color: blue
                pos:
                - 1.473
                - -0.747
                - 0.8
                yaw: -0.05117762915101309
                'on': parts_cart
              - name: green_tall_block
                kind: tall_block
                color: green
                pos:
                - 1.697
                - -0.42
                - 0.8
                yaw: 11.005974866621933
                'on': parts_cart
              fixtures:
              - name: tray
                kind: tray
                color: grey
                pos:
                - 1.716
                - -0.764
                - 0.8
                'on': parts_cart
              goal:
                object: blue_tall_block
                container: tray
              task: Put the blue tall block in the grey tray. Leave the other objects where they are.
              success: the blue tall block rests inside the grey tray (its centre within the container's inner footprint and below its rim), no part of the robot touches it, and no other object is inside the grey tray
              steps: 2400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
