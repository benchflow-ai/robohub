# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "28a88eede1d641300a93c3e21d9843bc"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/sort-by-color--franka-panda--tabletop--budget-tight--s2
          description: 'Sort objects into containers by colour: Franka Emika Panda in the tabletop'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: sort-by-color--franka-panda--tabletop--budget-tight--s2
          suite: remix
          category: sort-by-color
          difficulty: medium
          tags:
          - remix
          - franka-panda
          - tabletop
          - tabletop
          - arm
          - long-horizon
          - pick-and-place
          embodiment: franka-panda
          scene: tabletop
          scenario: tabletop
          track: arm
          capabilities:
          - long-horizon
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 634
        agent:
          timeout_sec: 2175
        verifier:
          timeout_sec: 120
        robouse:
          id: sort-by-color--franka-panda--tabletop--budget-tight--s2
          backend: remix
          env: sort-by-color--franka-panda--tabletop--budget-tight--s2
          seed: 2
          max_steps: 1450
          camera: front
          cameras:
          - overview
          - robot/arm_wrist
          - front
          - top
          skills: true
          success_mode: final
          components:
            embodiment: franka-panda@0.1.0
            scene: tabletop@0.1.0
            task: sort-by-color@0.1.0
            modifiers:
              obs: state
              budget: tight
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: franka-panda
            scene: tabletop
            task: sort-by-color
            seed: 2
            modifiers:
              obs: state
              budget: tight
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: green_small_block_2
                kind: small_block
                color: green
                pos:
                - -0.122
                - -0.304
                - 0.75
                yaw: -2.4129830759987376
                'on': table
              - name: green_large_block_1
                kind: large_block
                color: green
                pos:
                - 0.336
                - -0.028
                - 0.75
                yaw: -0.9026547695768823
                'on': table
              - name: red_block_2
                kind: block
                color: red
                pos:
                - -0.198
                - -0.307
                - 0.75
                yaw: -5.354070024160411
                'on': table
              - name: red_large_block_1
                kind: large_block
                color: red
                pos:
                - -0.34
                - -0.294
                - 0.75
                yaw: -4.441814361516173
                'on': table
              fixtures:
              - name: red_bowl
                kind: bowl
                color: red
                pos:
                - -0.129
                - -0.03
                - 0.75
                'on': table
              - name: green_bowl
                kind: bowl
                color: green
                pos:
                - 0.179
                - -0.266
                - 0.75
                'on': table
              goal:
                assign:
                  green_small_block_2: green_bowl
                  green_large_block_1: green_bowl
                  red_block_2: red_bowl
                  red_large_block_1: red_bowl
                object: green_small_block_2
              task: 'Sort the objects by colour: put every red object into the red bowl and every green object into the green bowl.'
              success: every object rests inside the bowl of its own colour and no part of the robot touches any of them
              steps: 1450
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "3075"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
