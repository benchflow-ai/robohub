# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "242d776cb3ba34811aab72d152b7685d"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/go-to-landmark--google-robot--outdoor-field--s3
          description: 'Go to the mat described by a spatial relation: Google Robot in the outdoor field'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: go-to-landmark--google-robot--outdoor-field--s3
          suite: remix
          category: go-to-landmark
          difficulty: easy
          tags:
          - remix
          - google-robot
          - outdoor-field
          - outdoor-field
          - mobile-manipulation
          - spatial-reasoning
          - navigation
          embodiment: google-robot
          scene: outdoor-field
          scenario: outdoor-field
          track: mobile-manipulation
          capabilities:
          - spatial-reasoning
          - navigation
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 312
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: go-to-landmark--google-robot--outdoor-field--s3
          backend: remix
          env: go-to-landmark--google-robot--outdoor-field--s3
          seed: 3
          max_steps: 1200
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - top
          skills: true
          success_mode: final
          components:
            embodiment: google-robot@0.1.0
            scene: outdoor-field@0.1.0
            task: go-to-landmark@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: google-robot
            scene: outdoor-field
            task: go-to-landmark
            seed: 3
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects: []
              fixtures:
              - name: yellow_mat
                kind: mat
                color: yellow
                pos:
                - -1.336
                - -1.312
                - 0.0
                half:
                - 0.3
                - 0.3
                'on': floor
              - name: green_mat
                kind: mat
                color: green
                pos:
                - -0.22
                - 2.566
                - 0.0
                half:
                - 0.3
                - 0.3
                'on': floor
              - name: blue_mat
                kind: mat
                color: blue
                pos:
                - 2.19
                - -1.018
                - 0.0
                half:
                - 0.3
                - 0.3
                'on': floor
              goal:
                target: green_mat
                landmark: the tool shed
              task: Three coloured mats lie on the floor. Go to the mat closest to the tool shed and stop on it. (Closest means the smallest distance between the mat's centre and the centre of the tool shed.)
              success: the robot's base centre is on that mat and the robot is standing still (not stepping or driving)
              steps: 1200
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
