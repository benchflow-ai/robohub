# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "a111cdac319e088648944a6b86cf9fdc"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/stack-in-order--franka-panda--lab-bench--pert-clutter--s5
          description: 'Stack blocks in a stated order: Franka Emika Panda in the lab bench'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: stack-in-order--franka-panda--lab-bench--pert-clutter--s5
          suite: remix
          category: stack-in-order
          difficulty: medium
          tags:
          - remix
          - franka-panda
          - lab-bench
          - lab
          - arm
          - spatial-reasoning
          - pick-and-place
          embodiment: franka-panda
          scene: lab-bench
          scenario: lab
          track: arm
          capabilities:
          - spatial-reasoning
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 511
        agent:
          timeout_sec: 2100
        verifier:
          timeout_sec: 120
        robouse:
          id: stack-in-order--franka-panda--lab-bench--pert-clutter--s5
          backend: remix
          env: stack-in-order--franka-panda--lab-bench--pert-clutter--s5
          seed: 5
          max_steps: 1400
          camera: bench_cam
          cameras:
          - overview
          - robot/arm_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: franka-panda@0.1.0
            scene: lab-bench@0.1.0
            task: stack-in-order@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: clutter
              safety: none
              roles: single
          remix:
            embodiment: franka-panda
            scene: lab-bench
            task: stack-in-order
            seed: 5
            modifiers:
              obs: state
              budget: normal
              perturbation: clutter
              safety: none
              roles: single
            instance:
              objects:
              - name: orange_block
                kind: block
                color: orange
                pos:
                - 0.368
                - 1.08
                - 0.9
                yaw: -6.371755159924225
                'on': lab_bench
              - name: green_block
                kind: block
                color: green
                pos:
                - -0.048
                - 1.145
                - 0.9
                yaw: 9.544262594605172
                'on': lab_bench
              - name: blue_block
                kind: block
                color: blue
                pos:
                - 0.253
                - 1.028
                - 0.9
                yaw: -0.16744755043817783
                'on': lab_bench
              - name: white_block_distractor
                kind: block
                color: white
                pos:
                - 0.291
                - 1.124
                - 0.9
                yaw: -11.555586775914943
                'on': lab_bench
              - name: brown_small_block_distractor
                kind: small_block
                color: brown
                pos:
                - 0.156
                - 0.95
                - 0.9
                yaw: 0.08073517328794733
                'on': lab_bench
              fixtures:
              - name: base_mark
                kind: zone
                color: black
                pos:
                - -0.268
                - 1.027
                - 0.9
                half:
                - 0.045
                - 0.045
                'on': lab_bench
              goal:
                order:
                - blue_block
                - orange_block
                - green_block
                mark: base_mark
                object: blue_block
              task: 'Build a tower of the three blocks on the black mark: the blue block at the bottom, the green block on top, and the remaining block in the middle.'
              success: the bottom block rests on the surface with its centre on the black mark (within 3 cm), each other block rests on the one below it (centres within 2.5 cm horizontally, touching), every block is level (tilted less than 15 degrees) and the robot touches none of them
              steps: 1400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
