# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "b11c026e16a31cd4f6fe7535a0e2c40d"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/push-to-zone--franka-panda--warehouse--s4
          description: 'Push an object that cannot be grasped into a marked zone: Franka Emika Panda in the warehouse aisle'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: push-to-zone--franka-panda--warehouse--s4
          suite: remix
          category: push-to-zone
          difficulty: medium
          tags:
          - remix
          - franka-panda
          - warehouse
          - warehouse
          - arm
          - contact-rich
          embodiment: franka-panda
          scene: warehouse
          scenario: warehouse
          track: arm
          capabilities:
          - contact-rich
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 117
        agent:
          timeout_sec: 1350
        verifier:
          timeout_sec: 120
        robouse:
          id: push-to-zone--franka-panda--warehouse--s4
          backend: remix
          env: push-to-zone--franka-panda--warehouse--s4
          seed: 4
          max_steps: 900
          camera: station_cam
          cameras:
          - overview
          - robot/arm_wrist
          - station_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: franka-panda@0.1.0
            scene: warehouse@0.1.0
            task: push-to-zone@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: franka-panda
            scene: warehouse
            task: push-to-zone
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: crate
                kind: crate
                color: cardboard
                pos:
                - 2.156
                - -1.684
                - 0.85
                yaw: 0.0
                'on': packing_station
              fixtures:
              - name: target_zone
                kind: zone
                color: green
                pos:
                - 2.466
                - -1.743
                - 0.85
                half:
                - 0.1
                - 0.08
                'on': packing_station
              goal:
                object: crate
                zone: target_zone
              task: The crate is too wide to grasp. Push it into the green zone.
              success: the centre of the crate is inside the green zone, it is upright (tilted less than 15 degrees) and nothing of the robot touches it
              steps: 900
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2250"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
