# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "03e0e0814196cb3dc0fc8327b18b6d24"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/bimanual-relay--aloha-2--lab-bench--s4
          description: 'Move an object across a span no single arm reaches: ALOHA 2 in the lab bench'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: bimanual-relay--aloha-2--lab-bench--s4
          suite: remix
          category: bimanual-relay
          difficulty: medium
          tags:
          - remix
          - aloha-2
          - lab-bench
          - lab
          - arm
          - long-horizon
          - bimanual-coordination
          embodiment: aloha-2
          scene: lab-bench
          scenario: lab
          track: arm
          capabilities:
          - long-horizon
          - bimanual-coordination
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 441
        agent:
          timeout_sec: 2100
        verifier:
          timeout_sec: 120
        robouse:
          id: bimanual-relay--aloha-2--lab-bench--s4
          backend: remix
          env: bimanual-relay--aloha-2--lab-bench--s4
          seed: 4
          max_steps: 1400
          camera: bench_cam
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: aloha-2@0.1.0
            scene: lab-bench@0.1.0
            task: bimanual-relay@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: aloha-2
            scene: lab-bench
            task: bimanual-relay
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: blue_small_block
                kind: small_block
                color: blue
                pos:
                - 0.7
                - 1.195
                - 0.9
                yaw: 0.0
                'on': lab_bench
              fixtures:
              - name: goal_mark
                kind: zone
                color: green
                pos:
                - -0.7
                - 1.152
                - 0.9
                half:
                - 0.06
                - 0.06
                'on': lab_bench
              goal:
                object: blue_small_block
                zone: goal_mark
              task: Move the blue small block onto the green mark at the other end of the station. The two points are too far apart for one arm to reach both.
              success: the blue small block rests on the surface with its centre on the green mark (a 12 cm square), level (tilted less than 15 degrees), and neither arm touches it
              steps: 1400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
