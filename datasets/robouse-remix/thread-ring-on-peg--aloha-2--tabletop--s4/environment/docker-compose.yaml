# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "515d7d2f9bf5859e62c04eb51cc20006"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/thread-ring-on-peg--aloha-2--tabletop--s4
          description: 'Thread a ring onto the right peg: ALOHA 2 in the tabletop'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: thread-ring-on-peg--aloha-2--tabletop--s4
          suite: remix
          category: thread-ring-on-peg
          difficulty: hard
          tags:
          - remix
          - aloha-2
          - tabletop
          - tabletop
          - arm
          - topological-reasoning
          - spatial-reasoning
          - contact-rich
          embodiment: aloha-2
          scene: tabletop
          scenario: tabletop
          track: arm
          capabilities:
          - topological-reasoning
          - spatial-reasoning
          - contact-rich
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 410
        agent:
          timeout_sec: 1350
        verifier:
          timeout_sec: 120
        robouse:
          id: thread-ring-on-peg--aloha-2--tabletop--s4
          backend: remix
          env: thread-ring-on-peg--aloha-2--tabletop--s4
          seed: 4
          max_steps: 900
          camera: front
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - front
          - top
          skills: true
          success_mode: final
          components:
            embodiment: aloha-2@0.1.0
            scene: tabletop@0.1.0
            task: thread-ring-on-peg@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: aloha-2
            scene: tabletop
            task: thread-ring-on-peg
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: ring
                kind: ring
                color: orange
                pos:
                - -0.097
                - 0.008
                - 0.75
                yaw: 0.0
                'on': table
              - name: purple_block
                kind: block
                color: purple
                pos:
                - 0.674
                - 0.036
                - 0.75
                yaw: 0.0
                'on': table
              fixtures:
              - name: yellow_peg
                kind: peg
                color: yellow
                pos:
                - 0.591
                - -0.134
                - 0.75
                'on': table
              - name: red_peg
                kind: peg
                color: red
                pos:
                - 0.133
                - -0.075
                - 0.75
                'on': table
              goal:
                object: ring
                peg: yellow_peg
              task: Put the ring over the peg that stands closer to the purple block, so that the peg passes through the ring's hole.
              success: the peg that is closer to the purple block passes through the ring's hole (the peg's axis crosses the ring's plane inside its hole, below the peg's top), and the robot does not touch the ring
              steps: 900
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2250"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
