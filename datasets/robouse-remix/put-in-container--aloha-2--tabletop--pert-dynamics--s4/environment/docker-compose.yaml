# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-1226e7b5b90ab436"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "2b5bbd8c48b3acc42be542530c51c1b0"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/put-in-container--aloha-2--tabletop--pert-dynamics--s4
          description: 'Put an object in a container: ALOHA 2 in the tabletop'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: put-in-container--aloha-2--tabletop--pert-dynamics--s4
          suite: remix
          category: put-in-container
          difficulty: easy
          tags:
          - remix
          - aloha-2
          - tabletop
          - tabletop
          - arm
          - pick-and-place
          embodiment: aloha-2
          scene: tabletop
          scenario: tabletop
          track: arm
          capabilities:
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 175
        agent:
          timeout_sec: 1050
        verifier:
          timeout_sec: 120
        robouse:
          id: put-in-container--aloha-2--tabletop--pert-dynamics--s4
          backend: remix
          env: put-in-container--aloha-2--tabletop--pert-dynamics--s4
          seed: 4
          max_steps: 700
          camera: front
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - front
          - top
          skills: true
          success_mode: final
          components:
            embodiment: aloha-2@0.1.0
            scene: tabletop@0.1.0
            task: put-in-container@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: dynamics
              safety: none
              roles: single
          remix:
            embodiment: aloha-2
            scene: tabletop
            task: put-in-container
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: dynamics
              safety: none
              roles: single
            instance:
              objects:
              - name: blue_block
                kind: block
                color: blue
                pos:
                - 0.434
                - -0.115
                - 0.75
                yaw: 8.919246580503753
                'on': table
              - name: green_block
                kind: block
                color: green
                pos:
                - 0.578
                - -0.055
                - 0.75
                yaw: -1.668089334494085
                'on': table
              fixtures:
              - name: tray
                kind: tray
                color: grey
                pos:
                - 0.123
                - -0.075
                - 0.75
                'on': table
              goal:
                object: blue_block
                container: tray
              task: Put the blue block in the grey tray. Leave the other objects where they are.
              success: the blue block rests inside the grey tray (its centre within the container's inner footprint and below its rim), no part of the robot touches it, and no other object is inside the grey tray
              steps: 700
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "1950"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
