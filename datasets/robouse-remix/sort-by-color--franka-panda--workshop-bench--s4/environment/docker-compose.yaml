# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../runtime-9b5493862f20134c"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBO_ORACLE_TOKEN: "857b453f04194fb84801731541990d3f"
      ROBO_EPISODE_FACTORY: "robouse.embodied:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/sort-by-color--franka-panda--workshop-bench--s4
          description: 'Sort objects into containers by colour: Franka Emika Panda in the workshop bench'
        metadata:
          source_benchmark: robouse remix (components)
          source_task: sort-by-color--franka-panda--workshop-bench--s4
          suite: remix
          category: sort-by-color
          difficulty: medium
          tags:
          - remix
          - franka-panda
          - workshop-bench
          - workshop-assembly
          - arm
          - long-horizon
          - pick-and-place
          embodiment: franka-panda
          scene: workshop-bench
          scenario: workshop-assembly
          track: arm
          capabilities:
          - long-horizon
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 698
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: sort-by-color--franka-panda--workshop-bench--s4
          backend: remix
          env: sort-by-color--franka-panda--workshop-bench--s4
          seed: 4
          max_steps: 2400
          camera: bench_cam
          cameras:
          - overview
          - robot/arm_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          components:
            embodiment: franka-panda@0.1.0
            scene: workshop-bench@0.1.0
            task: sort-by-color@0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
          remix:
            embodiment: franka-panda
            scene: workshop-bench
            task: sort-by-color
            seed: 4
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            instance:
              objects:
              - name: blue_bolt_2
                kind: bolt
                color: blue
                pos:
                - -0.402
                - 1.103
                - 0.9
                yaw: 4.218445268264722
                'on': workbench
              - name: red_large_block_1
                kind: large_block
                color: red
                pos:
                - -0.379
                - 1.032
                - 0.9
                yaw: 3.8042858994274598
                'on': workbench
              - name: red_block_2
                kind: block
                color: red
                pos:
                - 0.015
                - 1.008
                - 0.9
                yaw: -0.2950704807390938
                'on': workbench
              - name: blue_bolt_1
                kind: bolt
                color: blue
                pos:
                - -0.405
                - 1.174
                - 0.9
                yaw: 4.182195449405125
                'on': workbench
              fixtures:
              - name: red_tray
                kind: tray
                color: red
                pos:
                - -0.169
                - 1.142
                - 0.9
                'on': workbench
              - name: blue_tray
                kind: tray
                color: blue
                pos:
                - 0.21
                - 1.127
                - 0.9
                'on': workbench
              goal:
                assign:
                  blue_bolt_2: blue_tray
                  red_large_block_1: red_tray
                  red_block_2: red_tray
                  blue_bolt_1: blue_tray
                object: blue_bolt_2
              task: 'Sort the objects by colour: put every red object into the red tray and every blue object into the blue tray.'
              success: every object rests inside the tray of its own colour and no part of the robot touches any of them
              steps: 2400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
