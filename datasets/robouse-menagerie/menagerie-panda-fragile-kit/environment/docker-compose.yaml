# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/menagerie"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:40eb64c1910118d9c821aafcef547ac49cc34534a4283d66b61b92e5f5dbf911"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "7dbb3ed248b2bf05ca98da49c0f3bfc0"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/menagerie-panda-fragile-kit
          description: Read each vial's hidden underside label with an upward camera, then pack it by colour (dual Panda).
        metadata:
          source_benchmark: robo-use (BenchFlow)
          source_task: robo-use L03 Fragile Kit
          family: L03
          suite: menagerie
          category: manipulation
          difficulty: hard
          tags:
          - mujoco
          - menagerie
          - panda
          - dual-panda
          - long-horizon
          - vision
          - hidden-state
          - protected-objects
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: menagerie-panda-fragile-kit
          backend: menagerie
          env: menagerie-panda-fragile-kit
          seed: 2
          max_steps: 2500
          camera: workspace
          cameras:
          - workspace
          - inspect
          skills: true
          success_mode: final
          obs_mode: vision
          visible_fields:
          - robot
          - time_s
          - selected_arm
          - hand_pos
          - hand_target
          - gripper_open
          - touching
          - left_hand_pos
          - left_hand_target
          - left_gripper_open
          - left_touching
          - right_hand_pos
          - right_hand_target
          - right_gripper_open
          - right_touching
          - vial_0_pos
          - vial_0_tilt_deg
          - vial_0_yaw_deg
          - vial_1_pos
          - vial_1_tilt_deg
          - vial_1_yaw_deg
          - vial_2_pos
          - vial_2_tilt_deg
          - vial_2_yaw_deg
          - ampoule_0_pos
          - ampoule_0_tilt_deg
          - ampoule_0_yaw_deg
          - ampoule_1_pos
          - ampoule_1_tilt_deg
          - ampoule_1_yaw_deg
          - red_compartment_center
          - blue_compartment_center
          - green_compartment_center
          - compartment_inner_half_size
          - inspection_station
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
