# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/rlebench"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:f31e715b3ca1ca7e98330100098ef8b6a391a8048703a3387f7f7953834bfd22"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/rle-balance-coins
          description: Find the one heavier cube of nine with a two-pan balance and put it alone on the answer mat (RLE-Bench tabletop reasoning).
        metadata:
          source_benchmark: RLE-Bench (RLE-Bench/RLE-Bench, commit 34a73aa)
          source_task: task03 BalanceCoins
          suite: rle-bench
          category: manipulation
          difficulty: hard
          tags:
          - mujoco
          - robosuite
          - panda
          - mobile-manipulator
          - vision
          - balance
          - hidden-mass
          - physical-reasoning
          - active-perception
          rle_bench:
            family: 'task03 (interactive control: tabletop reasoning)'
            task: BalanceCoins
            seed: RLE-Bench's evaluation seed for this task
            scoring: RLE-Bench quality >= 0.5 passes (quality recorded in result.json)
        agent:
          timeout_sec: 32400
        verifier:
          timeout_sec: 600
        robouse:
          id: rle-balance-coins
          backend: rlebench
          env: rle-balance-coins
          seed: 0
          max_steps: 50000
          obs_mode: vision
          visible_fields:
          - joint_pos
          - joint_vel
          - eef_pos
          - eef_quat
          - gripper_pos
          - base_pos
          - base_quat
          - eef_base_pos
          - eef_base_quat
          - cube_positions
          - pan_positions
          camera: robot0_agentview_left
          cameras:
          - robot0_agentview_left
          - robot0_agentview_right
          - robot0_eye_in_hand
          skills: true
          success_mode: final
          frame_every: 10
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "33300"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
volumes:
  rpc: {}
  episode: {}
