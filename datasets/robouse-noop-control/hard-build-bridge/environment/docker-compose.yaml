# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "7378035b47c01f1efd031ef5c243dfb0"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-build-bridge
          description: Build a three-level bridge (vision, low-level control)
        metadata:
          source_benchmark: robouse original
          source_task: build a specified three-level structure
          source_suite: hard
          suite: hard
          category: construction
          difficulty: hard
          tags:
          - construction
          - vision-only
          - no-object-coordinates
          - uncalibrated-camera
          - no-projection-matrix
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-build-bridge
          backend: tabletop
          seed: 0
          max_steps: 1100
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          - top
          uncalibrated_cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-build-bridge
            title: Build a three-level bridge (vision, low-level control)
            goal: 'Build this structure: the two red cubes (4 cm) stand on the two small grey pads (one cube per pad, centre inside the pad); the long yellow beam (16 cm x 3.6 cm x 2 cm) lies flat across the tops of both red cubes (tilt under 5 degrees, resting on both); the blue cube (3.6 cm) sits on top of the beam, within 1.5 cm of the beam''s centre. Everything must be released and stay standing.'
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - -0.22
              - -0.16
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_2
              kind: box
              color: red
              pos:
              - 0.24
              - -0.02
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_3
              kind: box
              color: yellow
              pos:
              - -0.05
              - -0.17
              size:
              - 0.08
              - 0.018
              - 0.01
            - name: item_4
              kind: box
              color: blue
              pos:
              - 0.2
              - -0.18
              size:
              - 0.018
              - 0.018
              - 0.018
            fixtures:
            - name: pad_left
              kind: pad
              pos:
              - -0.05
              - 0.13
              size:
              - 0.025
              - 0.025
              color: grey
            - name: pad_right
              kind: pad
              pos:
              - 0.05
              - 0.13
              size:
              - 0.025
              - 0.025
              color: grey
            goals:
            - type: on_pad
              obj: item_1
              pad: pad_left
            - type: on_pad
              obj: item_2
              pad: pad_right
            - type: on_top_level
              obj: item_3
              base: item_1
              tol: 0.065
              max_tilt: 5
            - type: on_top_level
              obj: item_3
              base: item_2
              tol: 0.065
              max_tilt: 5
            - type: on_top
              obj: item_4
              base: item_3
              tol: 0.015
            max_steps: 1100
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
