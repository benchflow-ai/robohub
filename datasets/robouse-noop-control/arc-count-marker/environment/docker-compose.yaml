# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:57282710e7812db5c5215a9691b13355ed556523b58b1318300ed1ec400abd10"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/arc-count-marker
          description: 'Rule inference: the marker'
        metadata:
          source_benchmark: ARC-AGI (style), robouse original
          source_task: count-marker
          source_suite: arc-style
          suite: arc-style
          category: rule-inference
          difficulty: medium
          tags:
          - arc
          - few-shot
          - counting
        agent:
          timeout_sec: 900
        verifier:
          timeout_sec: 120
        robouse:
          id: arc-count-marker
          backend: tabletop
          seed: 0
          max_steps: 500
          camera: front
          skills: true
          success_mode: final
          scenario:
            id: arc-count-marker
            title: 'Rule inference: the marker'
            grid:
              rows: 3
              cols: 4
              cell: 0.08
              origin:
              - -0.12
              - 0.08
            objects:
            - name: block_1
              kind: box
              color: red
              cell:
              - 0
              - 0
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: block_2
              kind: box
              color: green
              cell:
              - 1
              - 2
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: block_3
              kind: box
              color: blue
              cell:
              - 2
              - 1
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: marker
              kind: box
              color: black
              pos:
              - 0.26
              - 0.08
              size:
              - 0.02
              - 0.02
              - 0.02
            fixtures:
            - name: pad_1
              kind: pad
              pos:
              - -0.18
              - -0.2
              size:
              - 0.035
              - 0.035
              color: grey
              label: '1'
            - name: pad_2
              kind: pad
              pos:
              - -0.06
              - -0.2
              size:
              - 0.035
              - 0.035
              color: grey
              label: '2'
            - name: pad_3
              kind: pad
              pos:
              - 0.06
              - -0.2
              size:
              - 0.035
              - 0.035
              color: grey
              label: '3'
            - name: pad_4
              kind: pad
              pos:
              - 0.18
              - -0.2
              size:
              - 0.035
              - 0.035
              color: grey
              label: '4'
            goals:
            - type: on_pad
              obj: marker
              pad: pad_3
            - type: grid
              objects:
              - block_1
              - block_2
              - block_3
              expected:
              - color: red
                cell:
                - 0
                - 0
              - color: green
                cell:
                - 1
                - 2
              - color: blue
                cell:
                - 2
                - 1
            max_steps: 500
            public:
              examples:
              - before:
                - color: red
                  cell:
                  - 0
                  - 1
                - color: yellow
                  cell:
                  - 2
                  - 2
                marker_before: off the grid
                after:
                - color: red
                  cell:
                  - 0
                  - 1
                - color: yellow
                  cell:
                  - 2
                  - 2
                marker_after: on pad 2
              - before:
                - color: blue
                  cell:
                  - 0
                  - 0
                - color: blue
                  cell:
                  - 0
                  - 3
                - color: green
                  cell:
                  - 1
                  - 1
                - color: red
                  cell:
                  - 2
                  - 2
                marker_before: off the grid
                after:
                - color: blue
                  cell:
                  - 0
                  - 0
                - color: blue
                  cell:
                  - 0
                  - 3
                - color: green
                  cell:
                  - 1
                  - 1
                - color: red
                  cell:
                  - 2
                  - 2
                marker_after: on pad 4
              - before:
                - color: orange
                  cell:
                  - 1
                  - 3
                marker_before: off the grid
                after:
                - color: orange
                  cell:
                  - 1
                  - 3
                marker_after: on pad 1
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "1800"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
