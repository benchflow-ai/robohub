# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "66a3faf01072e925fae444477e0f20bf"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-sort-six-drawer
          description: Sort six blocks into three containers, one of them a drawer (one uncalibrated camera, low-level control)
        metadata:
          source_benchmark: LIBERO-10 (long-horizon drawer + sorting), adapted and extended
          source_task: put the bowl in the drawer and close it + sorting
          source_suite: hard
          suite: hard
          category: long-horizon
          difficulty: hard
          tags:
          - long-horizon
          - drawer
          - sorting
          - vision-only
          - no-object-coordinates
          - single-camera
          - uncalibrated-camera
          - no-projection-matrix
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-sort-six-drawer
          backend: tabletop
          seed: 0
          max_steps: 1750
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          uncalibrated_cameras:
          - front
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-sort-six-drawer
            title: Sort six blocks into three containers, one of them a drawer (one uncalibrated camera, low-level control)
            goal: 'Six blocks lie on the table: two red, two blue, two green. Put both red blocks into the drawer of the cabinet and close the drawer (within 1 cm), put both blue blocks into the white bowl, and both green blocks into the grey tray. The drawer cabinet stands at the back right. Its drawer slides out toward the front (toward -y) by up to 12 cm; its handle is a horizontal bar along x, about 4 cm in front of the drawer face and 4.5 cm above the table. The fingers can close around the bar from above if the gripper is only partly open (e.g. grip 0.2; a fully open gripper hits the drawer face). The drawer''s inside is about 11.8 cm square with 5 cm high walls.'
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - -0.22
              - -0.15
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_2
              kind: box
              color: red
              pos:
              - 0.05
              - -0.12
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_3
              kind: box
              color: blue
              pos:
              - -0.04
              - -0.21
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_4
              kind: box
              color: blue
              pos:
              - 0.25
              - -0.18
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_5
              kind: box
              color: green
              pos:
              - -0.1
              - -0.06
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_6
              kind: box
              color: green
              pos:
              - -0.26
              - -0.02
              size:
              - 0.018
              - 0.018
              - 0.018
            fixtures:
            - name: drawer
              kind: drawer
              pos:
              - 0.17
              - 0.17
              color: darkgrey
              open: 0.0
            - name: bowl
              kind: bowl
              pos:
              - -0.2
              - 0.16
              radius: 0.065
              color: white
            - name: tray
              kind: tray
              pos:
              - -0.02
              - 0.18
              size:
              - 0.065
              - 0.05
              color: grey
            goals:
            - type: in
              obj: item_1
              container: drawer
            - type: in
              obj: item_2
              container: drawer
            - type: drawer
              drawer: drawer
              max_open: 0.01
            - type: in
              obj: item_3
              container: bowl
            - type: in
              obj: item_4
              container: bowl
            - type: in
              obj: item_5
              container: tray
            - type: in
              obj: item_6
              container: tray
            max_steps: 1750
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
