# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "cc1041fc6adc64aa7cf118b634b00116"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-curling-two
          description: 'Curling: two pucks into an unreachable zone'
        metadata:
          source_benchmark: robouse original
          source_task: curling (dynamic release, two objects)
          source_suite: hard
          suite: hard
          category: dynamics
          difficulty: hard
          tags:
          - dynamics
          - no-skills
          - max-repeat-5
          - one-shot
          - unreachable-goal
          - multi-object
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-curling-two
          backend: tabletop
          seed: 0
          max_steps: 1050
          camera: front
          skills: false
          success_mode: final
          max_repeat: 5
          scenario:
            id: hard-curling-two
            title: 'Curling: two pucks into an unreachable zone'
            goal: 'Slide both pucks (red and yellow) along the slippery lane so that both come to rest inside the blue zone at the same time. A puck that hits the other can knock it out. The lane is a smooth white slab 24 cm wide (x from -0.12 to 0.12) and 4 mm thick whose surface is very slippery (friction coefficient about 0.03 against the pucks); it runs from y = -0.25 past the back edge of the table and ends in mid-air at y = 0.85. A puck that slides past the end falls off. The gripper can only reach y <= 0.28, so the zone (the blue rectangle painted on the lane, x from -0.10 to 0.10, y from 0.44 to 0.62) cannot be reached: a puck must be pushed so that it slides there by itself, and a puck that stops beyond y = 0.28 can never be touched again. Each puck is a disc 5 cm across and 2 cm thick. Success is judged after `robo done`: the puck''s centre must be inside the zone, resting on the lane and no longer moving.'
            objects:
            - name: red_puck
              kind: cyl
              color: red
              pos:
              - -0.06
              - -0.1
              size:
              - 0.025
              - 0.01
              friction: 0.03
              z: 0.014
            - name: yellow_puck
              kind: cyl
              color: yellow
              pos:
              - 0.06
              - -0.1
              size:
              - 0.025
              - 0.01
              friction: 0.03
              z: 0.014
            fixtures:
            - name: lane
              kind: lane
              pos:
              - 0.0
              - 0.3
              size:
              - 0.12
              - 0.55
              height: 0.004
              friction: 0.03
              color: white
            - name: zone
              kind: pad
              pos:
              - 0.0
              - 0.53
              size:
              - 0.1
              - 0.09
              z: 0.004
              color: blue
            goals:
            - type: in_zone
              obj: red_puck
              rect:
              - -0.1
              - 0.1
              - 0.44
              - 0.62
              z: 0.004
            - type: in_zone
              obj: yellow_puck
              rect:
              - -0.1
              - 0.1
              - 0.44
              - 0.62
              z: 0.004
            max_steps: 1050
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
