# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:76ca877fb0b1008d896761538a5e7e5c3e8610b33004ac99b9c5f0e7a91127bc"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-fragile-tower
          description: Build a tower and crown it with a fragile vial (vision, low-level control)
        metadata:
          source_benchmark: BenchFlow robo-use D03 (impact-limited handling) combined with stacking
          source_task: D03 Gentle Insertion
          source_suite: hard
          suite: hard
          category: gentle
          difficulty: hard
          tags:
          - fragile
          - speed-limit
          - stacking
          - vision-only
          - no-object-coordinates
          - uncalibrated-camera
          - no-projection-matrix
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-fragile-tower
          backend: tabletop
          seed: 0
          max_steps: 850
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          - top
          uncalibrated_cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-fragile-tower
            title: Build a tower and crown it with a fragile vial (vision, low-level control)
            goal: Stack the blue cube (4.4 cm) on the red cube (5 cm) on the grey pad (red at the bottom, resting on the pad), then stand the fragile white vial (2.4 cm wide, 6 cm tall) upright on top of the blue cube (tilt under 10 degrees). The vial must never move downward faster than 0.1 m/s (0.2 cm per step), measured at every step and reported in `constraint_violations`; even a drop of a few millimetres breaks this limit. Each item must be centred on the one below within 1.5 cm.
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - -0.18
              - -0.1
              size:
              - 0.025
              - 0.025
              - 0.025
            - name: item_2
              kind: box
              color: blue
              pos:
              - 0.18
              - -0.12
              size:
              - 0.022
              - 0.022
              - 0.022
            - name: item_3
              kind: cyl
              color: white
              pos:
              - -0.05
              - -0.16
              size:
              - 0.012
              - 0.03
            fixtures:
            - name: grey_pad
              kind: pad
              pos:
              - 0.0
              - 0.12
              size:
              - 0.045
              - 0.045
              color: grey
            constraints:
            - type: max_down_speed
              object: item_3
              limit: 0.1
            goals:
            - type: stack
              order:
              - item_1
              - item_2
              - item_3
              pad: grey_pad
              tol: 0.015
            - type: upright
              obj: item_3
              max_tilt: 10
            max_steps: 850
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
