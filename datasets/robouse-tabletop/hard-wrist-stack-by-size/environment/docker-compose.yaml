# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "c37bb2594be133a5caf0c7e3a43b1a46"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-wrist-stack-by-size
          description: Stack by size with the wrist camera (low-level control)
        metadata:
          source_benchmark: robouse original
          source_task: stack by size
          source_suite: hard
          suite: hard
          category: active-perception
          difficulty: hard
          tags:
          - wrist-camera-only
          - no-object-coordinates
          - no-calibrated-world-camera
          - search
          - camera-offset-unknown
          - size-perception
          - no-skills
          - max-repeat-10
          - stacking
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-wrist-stack-by-size
          backend: tabletop
          seed: 0
          max_steps: 850
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - wrist
          uncalibrated_cameras:
          - wrist
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-wrist-stack-by-size
            title: Stack by size with the wrist camera (low-level control)
            goal: 'Three grey cubes of different sizes (5 cm, 4 cm and 3 cm) are somewhere on the table. Stack all three on the gold pad (centre x = 0.0, y = 0.15, 8 cm square): largest at the bottom, resting on the pad, then the middle one, then the smallest on top, each centred on the one below within 1.5 cm.'
            objects:
            - name: item_1
              kind: box
              color: grey
              pos:
              - 0.2
              - -0.15
              size:
              - 0.015
              - 0.015
              - 0.015
            - name: item_2
              kind: box
              color: grey
              pos:
              - -0.22
              - -0.02
              size:
              - 0.025
              - 0.025
              - 0.025
            - name: item_3
              kind: box
              color: grey
              pos:
              - 0.08
              - -0.05
              size:
              - 0.02
              - 0.02
              - 0.02
            fixtures:
            - name: gold_pad
              kind: pad
              pos:
              - 0.0
              - 0.15
              size:
              - 0.04
              - 0.04
              color: gold
            goals:
            - type: stack
              order:
              - item_2
              - item_3
              - item_1
              pad: gold_pad
              tol: 0.015
            constraints: []
            wrist_camera: true
            max_steps: 850
            camera: front
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
