# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:16ae6e6a3c3b70fdf7d62473846ee401dbe85096d92b9f96b3efde95e78ebb4d"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-uncal-hanoi-3
          description: 'One uncalibrated camera: Tower of Hanoi, three discs'
        metadata:
          source_benchmark: BenchFlow robo-use L-family (Tower of Hanoi)
          source_task: L-family long-horizon sequencing
          source_suite: hard
          suite: hard
          category: sequencing
          difficulty: hard
          tags:
          - hanoi
          - long-horizon
          - single-camera
          - uncalibrated-camera
          - no-projection-matrix
          - vision-only
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-uncal-hanoi-3
          backend: tabletop
          seed: 0
          max_steps: 1550
          camera: front
          skills: true
          success_mode: final
          obs_mode: vision
          cameras:
          - front
          uncalibrated_cameras:
          - front
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-uncal-hanoi-3
            title: 'One uncalibrated camera: Tower of Hanoi, three discs'
            goal: 'Move the tower of three square discs (flat plates: red 8 cm, yellow 6.4 cm, blue 4.8 cm wide, 2.4 cm thick) from the left grey pad to the right grey pad, using the middle grey pad as a buffer. Move one disc at a time, only ever the top disc of a pile (never pull a disc out from under another), and never leave a larger disc resting on a smaller one (both checked at every step and reported in `constraint_violations`). At the end all three must be stacked on the right pad, largest at the bottom, each centred on the one below within 2 cm. There is one camera (`front`) and its projection matrix is NOT given: work out where things are from the images, for example by moving the gripper (whose position you know) and seeing where it appears.'
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - -0.16
              - 0.02
              size:
              - 0.04
              - 0.04
              - 0.012
              z: 0.012
            - name: item_2
              kind: box
              color: yellow
              pos:
              - -0.16
              - 0.02
              size:
              - 0.032
              - 0.032
              - 0.012
              z: 0.036500000000000005
            - name: item_3
              kind: box
              color: blue
              pos:
              - -0.16
              - 0.02
              size:
              - 0.024
              - 0.024
              - 0.012
              z: 0.061
            fixtures:
            - name: pad_a
              kind: pad
              pos:
              - -0.16
              - 0.02
              size:
              - 0.05
              - 0.05
              color: grey
            - name: pad_b
              kind: pad
              pos:
              - 0.0
              - 0.02
              size:
              - 0.05
              - 0.05
              color: grey
            - name: pad_c
              kind: pad
              pos:
              - 0.16
              - 0.02
              size:
              - 0.05
              - 0.05
              color: grey
            constraints:
            - type: size_order
              objects:
              - item_1
              - item_2
              - item_3
            - type: top_only
              objects:
              - item_1
              - item_2
              - item_3
            goals:
            - type: stack
              order:
              - item_1
              - item_2
              - item_3
              pad: pad_c
              tol: 0.02
            max_steps: 1550
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
