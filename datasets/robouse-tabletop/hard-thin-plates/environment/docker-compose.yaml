# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:87e23e31c6fe17e7471455c898823b931712dd1c4c4fd10395e8efa27a437014"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "771fc569b2a7ccbc81f01d8d459c8cfa"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-thin-plates
          description: Stack four thin plates precisely (vision, low-level control)
        metadata:
          source_benchmark: robouse original
          source_task: precise stacking of thin plates
          source_suite: hard
          suite: hard
          category: precision
          difficulty: hard
          tags:
          - precision
          - stacking
          - thin-objects
          - vision-only
          - no-object-coordinates
          - uncalibrated-camera
          - no-projection-matrix
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-thin-plates
          backend: tabletop
          seed: 0
          max_steps: 1150
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          - top
          uncalibrated_cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-thin-plates
            title: Stack four thin plates precisely (vision, low-level control)
            goal: 'Stack the four thin square plates (1.2 cm thick; red 8 cm, yellow 6.6 cm, green 5.2 cm, blue 3.8 cm wide) on the grey pad in order of size: red at the bottom resting on the pad, then yellow, green, blue on top. Each plate must lie flat (tilt under 3 degrees) and be centred on the one below within 6 mm.'
            objects:
            - name: item_1
              kind: box
              color: red
              pos:
              - 0.2
              - -0.15
              size:
              - 0.04
              - 0.04
              - 0.006
            - name: item_2
              kind: box
              color: yellow
              pos:
              - -0.2
              - -0.12
              size:
              - 0.033
              - 0.033
              - 0.006
            - name: item_3
              kind: box
              color: green
              pos:
              - 0.05
              - -0.18
              size:
              - 0.026
              - 0.026
              - 0.006
            - name: item_4
              kind: box
              color: blue
              pos:
              - -0.22
              - 0.12
              size:
              - 0.019
              - 0.019
              - 0.006
            fixtures:
            - name: grey_pad
              kind: pad
              pos:
              - 0.12
              - 0.12
              size:
              - 0.05
              - 0.05
              color: grey
            goals:
            - type: stack
              order:
              - item_1
              - item_2
              - item_3
              - item_4
              pad: grey_pad
              tol: 0.006
            - type: on_top_level
              obj: item_2
              base: item_1
              tol: 0.006
              max_tilt: 3
            - type: on_top_level
              obj: item_3
              base: item_2
              tol: 0.006
              max_tilt: 3
            - type: on_top_level
              obj: item_4
              base: item_3
              tol: 0.006
              max_tilt: 3
            max_steps: 1150
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
