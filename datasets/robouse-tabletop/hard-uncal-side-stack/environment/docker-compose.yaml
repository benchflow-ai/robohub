# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:16ae6e6a3c3b70fdf7d62473846ee401dbe85096d92b9f96b3efde95e78ebb4d"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-uncal-side-stack
          description: 'One uncalibrated side camera: build a three-block tower'
        metadata:
          source_benchmark: robouse original
          source_task: stacking with an uncalibrated oblique camera
          source_suite: hard
          suite: hard
          category: perception
          difficulty: hard
          tags:
          - single-camera
          - uncalibrated-camera
          - no-projection-matrix
          - vision-only
          - no-object-coordinates
          - stacking
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-uncal-side-stack
          backend: tabletop
          seed: 0
          max_steps: 850
          camera: side
          skills: true
          success_mode: final
          obs_mode: vision
          cameras:
          - side
          uncalibrated_cameras:
          - side
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-uncal-side-stack
            title: 'One uncalibrated side camera: build a three-block tower'
            goal: 'Build a tower on the grey pad: the yellow block at the bottom (resting on the pad), the red block on it, the blue block on top, each centred on the one below within 1.5 cm. There is one camera (`side`, looking from the front right) and its projection matrix is NOT given: work out where things are from the images, for example by moving the gripper (whose position you know) and seeing where it appears.'
            objects:
            - name: item_1
              kind: box
              color: yellow
              pos:
              - -0.2
              - -0.12
              size:
              - 0.022
              - 0.022
              - 0.022
            - name: item_2
              kind: box
              color: red
              pos:
              - 0.1
              - -0.15
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_3
              kind: box
              color: blue
              pos:
              - -0.05
              - 0.16
              size:
              - 0.018
              - 0.018
              - 0.018
            fixtures:
            - name: grey_pad
              kind: pad
              pos:
              - 0.12
              - 0.1
              size:
              - 0.04
              - 0.04
              color: grey
            goals:
            - type: stack
              order:
              - item_1
              - item_2
              - item_3
              pad: grey_pad
              tol: 0.015
            max_steps: 850
            camera: side
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
