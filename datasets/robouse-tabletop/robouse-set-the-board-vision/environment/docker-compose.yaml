# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "765ea4bc2b3428ac06de85218e57033c"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/robouse-set-the-board-vision
          description: Set up a 2x2 board position
        metadata:
          source_benchmark: BenchFlow robo-use (task family, adapted to a single floating gripper)
          source_task: L01 Opening Night (set up a board position), reduced to four pieces
          source_suite: robo-use L-family
          suite: vision
          category: arrangement
          difficulty: medium
          tags:
          - robo-use
          - board
          - multi-object
          base_suite: robo-use-families
          base_task: robouse-set-the-board
        agent:
          timeout_sec: 900
        verifier:
          timeout_sec: 120
        robouse:
          id: robouse-set-the-board-vision
          backend: tabletop
          seed: 0
          max_steps: 1400
          camera: front
          skills: true
          success_mode: final
          scenario:
            id: robouse-set-the-board
            title: Set up a 2x2 board position
            goal: 'Set up this position on the 2x2 board: red piece on a1, blue piece on b2, white piece on a2, black piece on b1. Each piece must stand upright with its whole base inside its square. Squares: a1 = front-left, b1 = front-right, a2 = back-left, b2 = back-right (the pads are named sq_a1, sq_b1, sq_a2, sq_b2).'
            objects:
            - name: red_piece
              kind: cyl
              color: red
              pos:
              - -0.15
              - -0.15
              size:
              - 0.014
              - 0.025
            - name: blue_piece
              kind: cyl
              color: blue
              pos:
              - -0.05
              - -0.15
              size:
              - 0.014
              - 0.025
            - name: white_piece
              kind: cyl
              color: white
              pos:
              - 0.05
              - -0.15
              size:
              - 0.014
              - 0.025
            - name: black_piece
              kind: cyl
              color: black
              pos:
              - 0.15
              - -0.15
              size:
              - 0.014
              - 0.025
            fixtures:
            - name: sq_a1
              kind: pad
              pos:
              - -0.035
              - 0.05
              size:
              - 0.03
              - 0.03
              color: brown
              label: a1
            - name: sq_b1
              kind: pad
              pos:
              - 0.035
              - 0.05
              size:
              - 0.03
              - 0.03
              color: white
              label: b1
            - name: sq_a2
              kind: pad
              pos:
              - -0.035
              - 0.12
              size:
              - 0.03
              - 0.03
              color: white
              label: a2
            - name: sq_b2
              kind: pad
              pos:
              - 0.035
              - 0.12
              size:
              - 0.03
              - 0.03
              color: brown
              label: b2
            goals:
            - type: on_pad
              obj: red_piece
              pad: sq_a1
              full: true
              max_tilt: 10
            - type: on_pad
              obj: blue_piece
              pad: sq_b2
              full: true
              max_tilt: 10
            - type: on_pad
              obj: white_piece
              pad: sq_a2
              full: true
              max_tilt: 10
            - type: on_pad
              obj: black_piece
              pad: sq_b1
              full: true
              max_tilt: 10
            max_steps: 1400
          obs_mode: vision
          cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - holding
          - examples
          - grid
          - constraint_violations
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "1800"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
