# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:87e23e31c6fe17e7471455c898823b931712dd1c4c4fd10395e8efa27a437014"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "7e4e0674b87db3f3dde9f25d2f0e984e"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-wrist-shape-sort
          description: Sort by shape with the wrist camera (low-level control)
        metadata:
          source_benchmark: robouse original
          source_task: sort objects by shape
          source_suite: hard
          suite: hard
          category: active-perception
          difficulty: hard
          tags:
          - wrist-camera-only
          - no-object-coordinates
          - no-calibrated-world-camera
          - search
          - camera-offset-unknown
          - shape-perception
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-wrist-shape-sort
          backend: tabletop
          seed: 0
          max_steps: 1100
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - wrist
          uncalibrated_cameras:
          - wrist
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-wrist-shape-sort
            title: Sort by shape with the wrist camera (low-level control)
            goal: 'Four white objects stand on the table: two cylinders and two boxes (all 4 cm wide and 4 cm tall), at unknown places. Put both cylinders into the LEFT tray (centre x = -0.20, y = 0.18) and both boxes into the RIGHT tray (centre x = 0.20, y = 0.18). Each tray is 14 cm wide (x) and 10 cm deep (y) inside, with 3 cm high walls.'
            objects:
            - name: item_1
              kind: cyl
              color: white
              pos:
              - 0.12
              - -0.12
              size:
              - 0.02
              - 0.02
            - name: item_2
              kind: box
              color: white
              pos:
              - -0.18
              - -0.08
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_3
              kind: box
              color: white
              pos:
              - 0.02
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_4
              kind: cyl
              color: white
              pos:
              - -0.06
              - -0.19
              size:
              - 0.02
              - 0.02
            fixtures:
            - name: left_tray
              kind: tray
              pos:
              - -0.2
              - 0.18
              size:
              - 0.07
              - 0.05
              color: grey
            - name: right_tray
              kind: tray
              pos:
              - 0.2
              - 0.18
              size:
              - 0.07
              - 0.05
              color: grey
            goals:
            - type: in
              obj: item_1
              container: left_tray
            - type: in
              obj: item_4
              container: left_tray
            - type: in
              obj: item_2
              container: right_tray
            - type: in
              obj: item_3
              container: right_tray
            constraints: []
            wrist_camera: true
            max_steps: 1100
            camera: front
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
