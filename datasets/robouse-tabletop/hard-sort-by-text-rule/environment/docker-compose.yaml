# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:87e23e31c6fe17e7471455c898823b931712dd1c4c4fd10395e8efa27a437014"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "53ec63175882dae196f4c72cc4bddae0"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-sort-by-text-rule
          description: Sort by a two-part rule (vision, low-level control)
        metadata:
          source_benchmark: robouse original
          source_task: sorting by a compound rule on shape, proportion and colour
          source_suite: hard
          suite: hard
          category: sorting
          difficulty: hard
          tags:
          - compositional-rule
          - vision-only
          - no-object-coordinates
          - uncalibrated-camera
          - no-projection-matrix
          - shape-perception
          - distractors
          - no-skills
          - max-repeat-10
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-sort-by-text-rule
          backend: tabletop
          seed: 0
          max_steps: 1100
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          - top
          uncalibrated_cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-sort-by-text-rule
            title: Sort by a two-part rule (vision, low-level control)
            goal: 'Put into the white tray exactly these objects: every cylinder that is taller than it is wide, and every box that is red or orange. Every other object must stay where it is (within 2 cm of where it started). The tray is at the back right; it is 18 cm wide and 14 cm deep inside, with 3 cm high walls.'
            objects:
            - name: item_1
              kind: cyl
              color: green
              pos:
              - -0.24
              - -0.14
              size:
              - 0.015
              - 0.04
            - name: item_2
              kind: cyl
              color: green
              pos:
              - -0.1
              - -0.02
              size:
              - 0.025
              - 0.012
            - name: item_3
              kind: cyl
              color: blue
              pos:
              - 0.06
              - -0.17
              size:
              - 0.015
              - 0.035
            - name: item_4
              kind: box
              color: red
              pos:
              - 0.22
              - -0.08
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_5
              kind: box
              color: orange
              pos:
              - -0.2
              - 0.08
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_6
              kind: box
              color: pink
              pos:
              - 0.02
              - 0.06
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_7
              kind: box
              color: yellow
              pos:
              - -0.06
              - -0.2
              size:
              - 0.018
              - 0.018
              - 0.018
            - name: item_8
              kind: cyl
              color: red
              pos:
              - 0.15
              - -0.2
              size:
              - 0.026
              - 0.012
            fixtures:
            - name: tray
              kind: tray
              pos:
              - 0.18
              - 0.17
              size:
              - 0.09
              - 0.07
              color: white
            goals:
            - type: in
              obj: item_1
              container: tray
            - type: in
              obj: item_3
              container: tray
            - type: in
              obj: item_4
              container: tray
            - type: in
              obj: item_5
              container: tray
            - type: unmoved
              obj: item_2
            - type: unmoved
              obj: item_6
            - type: unmoved
              obj: item_7
            - type: unmoved
              obj: item_8
            max_steps: 1100
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
