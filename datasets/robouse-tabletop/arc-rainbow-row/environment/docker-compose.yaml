# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:87e23e31c6fe17e7471455c898823b931712dd1c4c4fd10395e8efa27a437014"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "6bd7850744a21f448a036ab20ea74e15"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/arc-rainbow-row
          description: 'Rule inference: ordering'
        metadata:
          source_benchmark: ARC-AGI (style), robouse original
          source_task: rainbow-row
          source_suite: arc-style
          suite: arc-style
          category: rule-inference
          difficulty: hard
          tags:
          - arc
          - few-shot
        agent:
          timeout_sec: 900
        verifier:
          timeout_sec: 120
        robouse:
          id: arc-rainbow-row
          backend: tabletop
          seed: 0
          max_steps: 1400
          camera: front
          skills: true
          success_mode: final
          scenario:
            id: arc-rainbow-row
            title: 'Rule inference: ordering'
            grid:
              rows: 3
              cols: 4
              cell: 0.08
              origin:
              - -0.12
              - 0.08
            objects:
            - name: block_1
              kind: box
              color: blue
              cell:
              - 0
              - 0
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: block_2
              kind: box
              color: green
              cell:
              - 1
              - 1
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: block_3
              kind: box
              color: red
              cell:
              - 0
              - 3
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: block_4
              kind: box
              color: orange
              cell:
              - 1
              - 2
              pos:
              - 0.0
              - 0.0
              size:
              - 0.02
              - 0.02
              - 0.02
            fixtures: []
            goals:
            - type: grid
              expected:
              - color: red
                cell:
                - 2
                - 0
              - color: orange
                cell:
                - 2
                - 1
              - color: green
                cell:
                - 2
                - 2
              - color: blue
                cell:
                - 2
                - 3
            max_steps: 1400
            public:
              examples:
              - before:
                - color: blue
                  cell:
                  - 0
                  - 1
                - color: red
                  cell:
                  - 1
                  - 3
                - color: yellow
                  cell:
                  - 0
                  - 2
                after:
                - color: red
                  cell:
                  - 2
                  - 0
                - color: yellow
                  cell:
                  - 2
                  - 1
                - color: blue
                  cell:
                  - 2
                  - 2
              - before:
                - color: green
                  cell:
                  - 1
                  - 0
                - color: orange
                  cell:
                  - 0
                  - 3
                after:
                - color: orange
                  cell:
                  - 2
                  - 0
                - color: green
                  cell:
                  - 2
                  - 1
              - before:
                - color: blue
                  cell:
                  - 2
                  - 3
                - color: yellow
                  cell:
                  - 0
                  - 0
                - color: red
                  cell:
                  - 1
                  - 1
                - color: green
                  cell:
                  - 2
                  - 0
                after:
                - color: red
                  cell:
                  - 2
                  - 0
                - color: yellow
                  cell:
                  - 2
                  - 1
                - color: green
                  cell:
                  - 2
                  - 2
                - color: blue
                  cell:
                  - 2
                  - 3
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "1800"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
