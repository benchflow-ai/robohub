# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:453a780cbc2972149bf99a92a41cd35666e51192e750bc2bcb1fb3deb04ca376"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Given only to the reference solution (oracle/solve.sh): unlocks privileged state in vision tasks.
      ROBOUSE_ORACLE_TOKEN: "0fabfabd1966bb47e733e5dbb63b9802"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-hanoi-4-vision-lowlevel
          description: Tower of Hanoi, four discs (vision, low-level control)
        metadata:
          source_benchmark: BenchFlow robo-use L-family (Tower of Hanoi), extended to four discs
          source_task: L-family long-horizon sequencing
          source_suite: hard
          suite: hard
          category: sequencing
          difficulty: hard
          tags:
          - hanoi
          - long-horizon
          - no-skills
          - max-repeat-10
          - vision-only
          - no-object-coordinates
          - tight-budget
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-hanoi-4-vision-lowlevel
          backend: tabletop
          seed: 0
          max_steps: 3150
          camera: front
          skills: false
          success_mode: final
          max_repeat: 10
          obs_mode: vision
          cameras:
          - front
          - top
          uncalibrated_cameras:
          - front
          - top
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-hanoi-4-vision-lowlevel
            title: Tower of Hanoi, four discs (vision, low-level control)
            goal: 'Move the tower of four square discs (flat plates of four sizes: red 8.4 cm, yellow 7 cm, green 5.6 cm, blue 4.2 cm wide, each 2 cm thick) from the left grey pad (pad_a) to the right grey pad (pad_c), using the middle pad (pad_b) as a buffer. Move one disc at a time, only ever the top disc of a pile (never pull a disc out from under another), and never leave a larger disc resting on a smaller one (both checked at every step and reported in `constraint_violations`). At the end the four discs must be stacked on pad_c, largest at the bottom, each centred on the one below within 2 cm. The minimum solution is 15 moves.'
            objects:
            - name: disc_1
              kind: box
              color: red
              pos:
              - -0.2
              - 0.04
              size:
              - 0.042
              - 0.042
              - 0.01
              z: 0.01
            - name: disc_2
              kind: box
              color: yellow
              pos:
              - -0.2
              - 0.04
              size:
              - 0.035
              - 0.035
              - 0.01
              z: 0.0305
            - name: disc_3
              kind: box
              color: green
              pos:
              - -0.2
              - 0.04
              size:
              - 0.028
              - 0.028
              - 0.01
              z: 0.051000000000000004
            - name: disc_4
              kind: box
              color: blue
              pos:
              - -0.2
              - 0.04
              size:
              - 0.021
              - 0.021
              - 0.01
              z: 0.0715
            fixtures:
            - name: pad_a
              kind: pad
              pos:
              - -0.2
              - 0.04
              size:
              - 0.055
              - 0.055
              color: grey
              label: A
            - name: pad_b
              kind: pad
              pos:
              - 0.0
              - 0.04
              size:
              - 0.055
              - 0.055
              color: grey
              label: B
            - name: pad_c
              kind: pad
              pos:
              - 0.2
              - 0.04
              size:
              - 0.055
              - 0.055
              color: grey
              label: C
            constraints:
            - type: size_order
              objects:
              - disc_1
              - disc_2
              - disc_3
              - disc_4
            - type: top_only
              objects:
              - disc_1
              - disc_2
              - disc_3
              - disc_4
            goals:
            - type: stack
              order:
              - disc_1
              - disc_2
              - disc_3
              - disc_4
              pad: pad_c
              tol: 0.02
            max_steps: 3150
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
