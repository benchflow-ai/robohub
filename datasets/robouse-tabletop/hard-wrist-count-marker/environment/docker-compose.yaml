# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/base"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:76ca877fb0b1008d896761538a5e7e5c3e8610b33004ac99b9c5f0e7a91127bc"
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/hard-wrist-count-marker
          description: Count with the wrist camera
        metadata:
          source_benchmark: robouse original
          source_task: count objects, then act on the count
          source_suite: hard
          suite: hard
          category: active-perception
          difficulty: hard
          tags:
          - wrist-camera-only
          - no-object-coordinates
          - no-calibrated-world-camera
          - search
          - camera-offset-unknown
          - counting
        agent:
          timeout_sec: 1200
        verifier:
          timeout_sec: 120
        robouse:
          id: hard-wrist-count-marker
          backend: tabletop
          seed: 0
          max_steps: 550
          camera: front
          skills: true
          success_mode: final
          obs_mode: vision
          cameras:
          - wrist
          uncalibrated_cameras:
          - wrist
          visible_fields:
          - hand_pos
          - gripper_open
          - constraint_violations
          scenario:
            id: hard-wrist-count-marker
            title: Count with the wrist camera
            goal: 'Coloured blocks are scattered over the table. Count them (do not count the black marker cube or the numbered pads) and put the black marker cube onto the grey pad whose number equals the count. The six numbered pads lie in a row along the front edge of the table: pad 1 is centred at x = -0.25, pad 2 at x = -0.15, pad 3 at x = -0.05, pad 4 at x = 0.05, pad 5 at x = 0.15, pad 6 at x = 0.25, all at y = -0.235, each 6 cm square. The marker starts at x = 0.0, y = 0.0. Leave the coloured blocks where they are (each must stay within 2 cm of where it started).'
            objects:
            - name: item_1
              kind: box
              color: black
              pos:
              - 0.0
              - 0.0
              size:
              - 0.015
              - 0.015
              - 0.015
            - name: item_2
              kind: box
              color: red
              pos:
              - -0.28
              - 0.22
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_3
              kind: box
              color: blue
              pos:
              - 0.28
              - 0.2
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_4
              kind: box
              color: green
              pos:
              - 0.1
              - 0.08
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_5
              kind: box
              color: yellow
              pos:
              - -0.15
              - -0.1
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_6
              kind: box
              color: purple
              pos:
              - 0.29
              - -0.12
              size:
              - 0.02
              - 0.02
              - 0.02
            - name: item_7
              kind: box
              color: orange
              pos:
              - -0.3
              - 0.02
              size:
              - 0.02
              - 0.02
              - 0.02
            fixtures:
            - name: pad_1
              kind: pad
              pos:
              - -0.25
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '1'
            - name: pad_2
              kind: pad
              pos:
              - -0.15
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '2'
            - name: pad_3
              kind: pad
              pos:
              - -0.04999999999999999
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '3'
            - name: pad_4
              kind: pad
              pos:
              - 0.050000000000000044
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '4'
            - name: pad_5
              kind: pad
              pos:
              - 0.15000000000000002
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '5'
            - name: pad_6
              kind: pad
              pos:
              - 0.25
              - -0.235
              size:
              - 0.03
              - 0.03
              color: grey
              label: '6'
            goals:
            - type: on_pad
              obj: item_1
              pad: pad_6
            - type: unmoved
              obj: item_2
            - type: unmoved
              obj: item_3
            - type: unmoved
              obj: item_4
            - type: unmoved
              obj: item_5
            - type: unmoved
              obj: item_6
            - type: unmoved
              obj: item_7
            constraints: []
            wrist_camera: true
            max_steps: 550
            camera: front
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
