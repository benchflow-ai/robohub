# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/fetch-and-deliver--google-robot--workshop-bench--s3
          description: 'Fetch an object from one surface and deliver it to another: Google Robot in the workshop bench'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: fetch-and-deliver--google-robot--workshop-bench--s3
          suite: composed
          category: fetch-and-deliver
          difficulty: hard
          tags:
          - composed
          - google-robot
          - workshop-bench
          - workshop-assembly
          - mobile-manipulation
          - long-horizon
          - navigation
          - pick-and-place
          embodiment: google-robot
          scene: workshop-bench
          scenario: workshop-assembly
          track: mobile-manipulation
          capabilities:
          - long-horizon
          - navigation
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 1626
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: fetch-and-deliver--google-robot--workshop-bench--s3
          backend: components
          env: fetch-and-deliver--google-robot--workshop-bench--s3
          seed: 3
          max_steps: 3600
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - bench_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: google-robot
              version: 0.1.0
            scene:
              id: workshop-bench
              version: 0.1.0
            task:
              id: fetch-and-deliver
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 3
            layout:
              objects:
              - name: yellow_tall_block
                kind: tall_block
                color: yellow
                pos:
                - 1.691
                - -0.829
                - 0.8
                yaw: 0.0
                'on': parts_cart
              fixtures:
              - name: drop_zone
                kind: zone
                color: green
                pos:
                - -0.174
                - 0.996
                - 0.9
                half:
                - 0.1
                - 0.1
                'on': workbench
              goal:
                object: yellow_tall_block
                zone: drop_zone
                surface: workbench
                from: parts_cart
              task: Bring the yellow tall block from the parts cart to the workbench and leave it standing on the green mark there.
              success: the yellow tall block stands on the workbench (touching its top, tilted less than 20 degrees) with its centre on the green mark, and no part of the robot touches it
              steps: 3600
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
