# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBO_TIMEOUT_S: "3600"
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/put-in-container--franka-panda--lab-bench--s2
          description: 'Put an object in a container: Franka Emika Panda in the lab bench'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: put-in-container--franka-panda--lab-bench--s2
          suite: composed
          category: put-in-container
          difficulty: easy
          tags:
          - composed
          - franka-panda
          - lab-bench
          - lab
          - arm
          - pick-and-place
          embodiment: franka-panda
          scene: lab-bench
          scenario: lab
          track: arm
          capabilities:
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 144
        agent:
          timeout_sec: 1050
        verifier:
          timeout_sec: 120
        robouse:
          id: put-in-container--franka-panda--lab-bench--s2
          backend: components
          env: put-in-container--franka-panda--lab-bench--s2
          seed: 2
          max_steps: 700
          camera: bench_cam
          cameras:
          - overview
          - robot/arm_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: franka-panda
              version: 0.1.0
            scene:
              id: lab-bench
              version: 0.1.0
            task:
              id: put-in-container
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 2
            layout:
              objects:
              - name: purple_small_block
                kind: small_block
                color: purple
                pos:
                - 0.047
                - 0.98
                - 0.9
                yaw: -1.616861020685108
                'on': lab_bench
              - name: blue_small_block
                kind: small_block
                color: blue
                pos:
                - 0.127
                - 1.035
                - 0.9
                yaw: 3.1964255825787937
                'on': lab_bench
              fixtures:
              - name: tray
                kind: tray
                color: grey
                pos:
                - -0.183
                - 1.07
                - 0.9
                'on': lab_bench
              goal:
                object: purple_small_block
                container: tray
              task: Put the purple small block in the grey tray. Leave the other objects where they are.
              success: the purple small block rests inside the grey tray (its centre within the container's inner footprint and below its rim), no part of the robot touches it, and no other object is inside the grey tray
              steps: 700
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "1950"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
