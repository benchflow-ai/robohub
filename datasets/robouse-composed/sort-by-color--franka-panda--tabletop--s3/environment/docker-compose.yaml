# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBO_TIMEOUT_S: "3600"
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/sort-by-color--franka-panda--tabletop--s3
          description: 'Sort objects into containers by colour: Franka Emika Panda in the tabletop'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: sort-by-color--franka-panda--tabletop--s3
          suite: composed
          category: sort-by-color
          difficulty: medium
          tags:
          - composed
          - franka-panda
          - tabletop
          - tabletop
          - arm
          - long-horizon
          - pick-and-place
          embodiment: franka-panda
          scene: tabletop
          scenario: tabletop
          track: arm
          capabilities:
          - long-horizon
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 631
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: sort-by-color--franka-panda--tabletop--s3
          backend: components
          env: sort-by-color--franka-panda--tabletop--s3
          seed: 3
          max_steps: 2400
          camera: front
          cameras:
          - overview
          - robot/arm_wrist
          - front
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: franka-panda
              version: 0.1.0
            scene:
              id: tabletop
              version: 0.1.0
            task:
              id: sort-by-color
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 3
            layout:
              objects:
              - name: blue_large_block_2
                kind: large_block
                color: blue
                pos:
                - -0.039
                - -0.293
                - 0.75
                yaw: 11.189791822296472
                'on': table
              - name: blue_block_1
                kind: block
                color: blue
                pos:
                - 0.339
                - -0.038
                - 0.75
                yaw: -1.6465063655344254
                'on': table
              - name: green_large_block_2
                kind: large_block
                color: green
                pos:
                - -0.233
                - -0.312
                - 0.75
                yaw: -8.732168803259315
                'on': table
              - name: green_block_1
                kind: block
                color: green
                pos:
                - -0.317
                - -0.233
                - 0.75
                yaw: 8.345361876486232
                'on': table
              fixtures:
              - name: blue_bowl
                kind: bowl
                color: blue
                pos:
                - 0.219
                - -0.262
                - 0.75
                'on': table
              - name: green_bowl
                kind: bowl
                color: green
                pos:
                - -0.124
                - -0.063
                - 0.75
                'on': table
              goal:
                assign:
                  blue_large_block_2: blue_bowl
                  blue_block_1: blue_bowl
                  green_large_block_2: green_bowl
                  green_block_1: green_bowl
                object: blue_large_block_2
              task: 'Sort the objects by colour: put every blue object into the blue bowl and every green object into the green bowl.'
              success: every object rests inside the bowl of its own colour and no part of the robot touches any of them
              steps: 2400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
