# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBO_TIMEOUT_S: "3600"
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/put-in-container--google-robot--tabletop--roles--s1
          description: 'Put an object in a container: Google Robot in the tabletop'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: put-in-container--google-robot--tabletop--roles--s1
          suite: composed
          category: put-in-container
          difficulty: easy
          tags:
          - composed
          - google-robot
          - tabletop
          - tabletop
          - mobile-manipulation
          - pick-and-place
          embodiment: google-robot
          scene: tabletop
          scenario: tabletop
          track: mobile-manipulation
          capabilities:
          - pick-and-place
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 1103
        agent:
          timeout_sec: 3600
        verifier:
          timeout_sec: 120
        robouse:
          id: put-in-container--google-robot--tabletop--roles--s1
          backend: components
          env: put-in-container--google-robot--tabletop--roles--s1
          seed: 1
          max_steps: 2400
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - front
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: google-robot
              version: 0.1.0
            scene:
              id: tabletop
              version: 0.1.0
            task:
              id: put-in-container
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: planner-operator
            seed: 1
            layout:
              objects:
              - name: orange_can
                kind: can
                color: orange
                pos:
                - 0.801
                - -0.289
                - 0.75
                yaw: 0.9894445331384212
                'on': table
              - name: red_can
                kind: can
                color: red
                pos:
                - -0.588
                - -0.272
                - 0.75
                yaw: 0.38564605314908906
                'on': table
              fixtures:
              - name: bowl
                kind: bowl
                color: white
                pos:
                - -0.021
                - -0.271
                - 0.75
                'on': table
              goal:
                object: orange_can
                container: bowl
              task: Put the orange can in the white bowl. Leave the other objects where they are.
              success: the orange can rests inside the white bowl (its centre within the container's inner footprint and below its rim), no part of the robot touches it, and no other object is inside the white bowl
              steps: 2400
          roles:
            planner:
              allow:
              - info
              - status
              - observe
            operator:
              allow: all
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4500"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
