# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/push-to-zone--aloha-2--kitchen-counter--s2
          description: 'Push an object that cannot be grasped into a marked zone: ALOHA 2 in the kitchen counter'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: push-to-zone--aloha-2--kitchen-counter--s2
          suite: composed
          category: push-to-zone
          difficulty: medium
          tags:
          - composed
          - aloha-2
          - kitchen-counter
          - household-kitchen
          - arm
          - contact-rich
          embodiment: aloha-2
          scene: kitchen-counter
          scenario: household-kitchen
          track: arm
          capabilities:
          - contact-rich
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 174
        agent:
          timeout_sec: 1350
        verifier:
          timeout_sec: 120
        robouse:
          id: push-to-zone--aloha-2--kitchen-counter--s2
          backend: components
          env: push-to-zone--aloha-2--kitchen-counter--s2
          seed: 2
          max_steps: 900
          camera: counter_cam
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - counter_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: aloha-2
              version: 0.1.0
            scene:
              id: kitchen-counter
              version: 0.1.0
            task:
              id: push-to-zone
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 2
            layout:
              objects:
              - name: crate
                kind: crate
                color: cardboard
                pos:
                - 0.081
                - 1.71
                - 0.9
                yaw: 0.0
                'on': counter
              fixtures:
              - name: target_zone
                kind: zone
                color: green
                pos:
                - -0.212
                - 1.702
                - 0.9
                half:
                - 0.1
                - 0.08
                'on': counter
              goal:
                object: crate
                zone: target_zone
              task: The crate is too wide to grasp. Push it into the green zone.
              success: the centre of the crate is inside the green zone, it is upright (tilted less than 15 degrees) and nothing of the robot touches it
              steps: 900
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2250"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
