# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/thread-ring-on-peg--franka-panda--workshop-bench--s2
          description: 'Thread a ring onto the right peg: Franka Emika Panda in the workshop bench'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: thread-ring-on-peg--franka-panda--workshop-bench--s2
          suite: composed
          category: thread-ring-on-peg
          difficulty: hard
          tags:
          - composed
          - franka-panda
          - workshop-bench
          - workshop-assembly
          - arm
          - topological-reasoning
          - spatial-reasoning
          - contact-rich
          embodiment: franka-panda
          scene: workshop-bench
          scenario: workshop-assembly
          track: arm
          capabilities:
          - topological-reasoning
          - spatial-reasoning
          - contact-rich
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 296
        agent:
          timeout_sec: 1350
        verifier:
          timeout_sec: 120
        robouse:
          id: thread-ring-on-peg--franka-panda--workshop-bench--s2
          backend: components
          env: thread-ring-on-peg--franka-panda--workshop-bench--s2
          seed: 2
          max_steps: 900
          camera: bench_cam
          cameras:
          - overview
          - robot/arm_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: franka-panda
              version: 0.1.0
            scene:
              id: workshop-bench
              version: 0.1.0
            task:
              id: thread-ring-on-peg
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 2
            layout:
              objects:
              - name: ring
                kind: ring
                color: orange
                pos:
                - -0.021
                - 1.139
                - 0.9
                yaw: 0.0
                'on': workbench
              - name: purple_block
                kind: block
                color: purple
                pos:
                - 0.309
                - 1.167
                - 0.9
                yaw: 0.0
                'on': workbench
              fixtures:
              - name: yellow_peg
                kind: peg
                color: yellow
                pos:
                - 0.182
                - 1.018
                - 0.9
                'on': workbench
              - name: green_peg
                kind: peg
                color: green
                pos:
                - -0.181
                - 1.011
                - 0.9
                'on': workbench
              goal:
                object: ring
                peg: yellow_peg
              task: Put the ring over the peg that stands closer to the purple block, so that the peg passes through the ring's hole.
              success: the peg that is closer to the purple block passes through the ring's hole (the peg's axis crosses the ring's plane inside its hole, below the peg's top), and the robot does not touch the ring
              steps: 900
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "2250"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
