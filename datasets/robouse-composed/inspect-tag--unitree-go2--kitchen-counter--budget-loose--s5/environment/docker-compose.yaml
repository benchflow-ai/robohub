# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/inspect-tag--unitree-go2--kitchen-counter--budget-loose--s5
          description: 'Read the number on an inspection tag: Unitree Go2 in the kitchen counter'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: inspect-tag--unitree-go2--kitchen-counter--budget-loose--s5
          suite: composed
          category: inspect-tag
          difficulty: medium
          tags:
          - composed
          - unitree-go2
          - kitchen-counter
          - household-kitchen
          - move
          - perception
          - partial-observability
          - navigation
          embodiment: unitree-go2
          scene: kitchen-counter
          scenario: household-kitchen
          track: move
          capabilities:
          - perception
          - partial-observability
          - navigation
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 156
        agent:
          timeout_sec: 3150
        verifier:
          timeout_sec: 120
        robouse:
          id: inspect-tag--unitree-go2--kitchen-counter--budget-loose--s5
          backend: components
          env: inspect-tag--unitree-go2--kitchen-counter--budget-loose--s5
          seed: 5
          max_steps: 2100
          camera: chase
          cameras:
          - overview
          - chase
          - robot/head
          - counter_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: unitree-go2
              version: 0.1.0
            scene:
              id: kitchen-counter
              version: 0.1.0
            task:
              id: inspect-tag
              version: 0.1.0
            modifiers:
              obs: state
              budget: loose
              perturbation: none
              safety: none
              roles: single
            seed: 5
            layout:
              objects: []
              fixtures:
              - name: tag
                kind: tag
                color: yellow
                pos:
                - -2.45
                - -0.2
                - 0.7
                normal:
                - 1
                - 0
                reading: 824
                label: the yellow tag on the west wall
                post: false
              goal:
                tag: tag
                reading: 824
              task: A yellow inspection tag hangs on the west wall; a three-digit number is printed on it. Go and look at it with your camera, read the number, and report it in the `robo done` message (for example `robo done "the tag reads 123"`).
              success: the tag was seen by the robot's own camera (its centre in the middle 70 % of the image, facing the camera, at most 2.5 m away, not blocked) for at least one second, and the `robo done` message contains the number and no other three-digit number
              steps: 2100
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "4050"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
