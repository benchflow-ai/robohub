# Embodied task topology (generated by benchflow.embodied.sidecar; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: the episode server, the episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBO_SOCKET: /rpc/episode.sock
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # No fixed image tag: compose names the image after the trial's project, so BenchFlow's per-trial
    # cleanup (`compose down --rmi all`) never removes an image another trial is using. Repeat builds of
    # the same runtime are served from the Docker build cache.
    build:
      context: "../../../../runtimes/composed"
      dockerfile: Dockerfile
    network_mode: none
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
    environment:
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBO_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      ROBO_EPISODE_FACTORY: "robouse.engine.sim:episode_from_task"
      # The task definition (task.md frontmatter); the entry point writes it to a file for the episode server.
      ROBO_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/bimanual-relay--aloha-2--workshop-bench--s3
          description: 'Move an object across a span no single arm reaches: ALOHA 2 in the workshop bench'
        metadata:
          source_benchmark: robouse composed task (components)
          source_task: bimanual-relay--aloha-2--workshop-bench--s3
          suite: composed
          category: bimanual-relay
          difficulty: medium
          tags:
          - composed
          - aloha-2
          - workshop-bench
          - workshop-assembly
          - arm
          - long-horizon
          - bimanual-coordination
          embodiment: aloha-2
          scene: workshop-bench
          scenario: workshop-assembly
          track: arm
          capabilities:
          - long-horizon
          - bimanual-coordination
          validation:
            oracle: 1.0
            noop: 0.0
            oracle_steps: 444
        agent:
          timeout_sec: 2100
        verifier:
          timeout_sec: 120
        robouse:
          id: bimanual-relay--aloha-2--workshop-bench--s3
          backend: components
          env: bimanual-relay--aloha-2--workshop-bench--s3
          seed: 3
          max_steps: 1400
          camera: bench_cam
          cameras:
          - overview
          - robot/left_wrist
          - robot/right_wrist
          - bench_cam
          - top
          skills: true
          success_mode: final
          instance:
            embodiment:
              id: aloha-2
              version: 0.1.0
            scene:
              id: workshop-bench
              version: 0.1.0
            task:
              id: bimanual-relay
              version: 0.1.0
            modifiers:
              obs: state
              budget: normal
              perturbation: none
              safety: none
              roles: single
            seed: 3
            layout:
              objects:
              - name: yellow_block
                kind: block
                color: yellow
                pos:
                - -0.7
                - 1.212
                - 0.9
                yaw: 0.0
                'on': workbench
              fixtures:
              - name: goal_mark
                kind: zone
                color: green
                pos:
                - 0.7
                - 1.221
                - 0.9
                half:
                - 0.06
                - 0.06
                'on': workbench
              goal:
                object: yellow_block
                zone: goal_mark
              task: Move the yellow block onto the green mark at the other end of the station. The two points are too far apart for one arm to reach both.
              success: the yellow block rests on the surface with its centre on the green mark (a 12 cm square), level (tilted less than 15 degrees), and neither arm touches it
              steps: 1400
        ---
    command: ["embodied-sim-entry", "--max-wall-s", "3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
