# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/gpu"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:b0c80bb5ccd168ae672d858f460a8e97f0c2448f2e1660c15150b62bed2fc862"
    # This runtime's simulator runs on a remote GPU worker (remote_worker in hub.yaml): the episode server reaches it
    # over HTTPS, so this service keeps network access, and it reads the worker endpoints (URL, shared secret) from
    # the host file named by $ROBOUSE_GPU_REMOTE, mounted read-only here only; the agent container never sees it.
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
      - ${ROBOUSE_GPU_REMOTE:?set ROBOUSE_GPU_REMOTE to the GPU worker endpoints file}:/run/robouse/remote.json:ro
    environment:
      ROBOUSE_GPU_REMOTE: /run/robouse/remote.json
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/gs-pour-water-narrow
          description: Pick up the glass of water and pour at least 70 % of it into the narrow, tall vase, spilling at most 15 %.
        metadata:
          source_benchmark: 'Genesis 1.4.2 (Genesis-Embodied-AI/Genesis, Apache-2.0): SPH liquid coupled to rigid bodies, CUDA backend'
          source_task: ''
          suite: gpu-genesis
          category: fluids
          difficulty: hard
          hard_because: 'fluid into an 8.5 cm opening 10 cm up: the stream must land in a target less than twice as wide as the glass mouth, from above its rim; pour point and tilt must be precise; positions randomized per seed'
          language_instruction: Pick up the glass of water and pour at least 70 % of it into the narrow, tall vase, spilling at most 15 %.
          tags:
          - gpu-required
          - genesis
          - fluid
          - precision
          reference_solution: 'scripted: top grasp, carry the glass so its rim sits just inside the vase''s near wall, tilt in steps to 130 degrees, set it back upright'
          gpu: required (NVIDIA RTX, remote worker)
        agent:
          timeout_sec: 2400
        verifier:
          timeout_sec: 120
        robouse:
          id: gs-pour-water-narrow
          backend: gpu
          sim: genesis
          env: pour-water-narrow
          seed: 0
          max_steps: 60
          skills: true
          success_mode: final
          obs_mode: state
          frame_every: 1
          linger_s: 5
          ready_timeout_s: 900
          rpc_timeout_s: 900
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "3300"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
