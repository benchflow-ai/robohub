          - -0.013880233754864338
          - -0.03984504972100819
          - -0.06082619813682428
          - 0.05760275414153839
          - -0.05750078156619255
          - -1.3763431906706136e-07
          - -7.617843614878863e-07
          - 0.0059743781254897165
          - -5.371704278633259e-05
