          - 0.0035552195428927725
          - 0.18963040180497287
          - -0.0009576215257089057
          - 0.05755345144563376
          - -0.05757180583523286
          - 5.24508124009468e-08
          - 1.6688952560452782e-07
          - 0.03060144246085389
