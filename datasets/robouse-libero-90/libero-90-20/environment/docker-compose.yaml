          - 0.1477905356821937
          - 0.1461090209605476
          - -0.3936228164492708
          - -0.0005672727465144156
          - 0.05761903688390824
          - -0.0573882151401446
          - -1.5747682793349792e-09
          - -3.582765494022758e-07
          - 0.004697247236681481
          - 1.712896420695107e-06
          - 0.0003906167432700831
