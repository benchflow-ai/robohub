# Robo Use task topology (generated by robohub/scripts/export.py; BenchFlow merges it over its base compose files).
#   main       the agent container: `robo` client only, /rpc mounted read-only (socket + camera images)
#   simulator  trusted: Robo Use episode server (MuJoCo), episode record in /episode, runs the verifier
services:
  main:
    environment:
      ROBOUSE_SOCKET: /rpc/episode.sock
    # !override drops BenchFlow's default host mount of /logs/verifier into the agent container, so the
    # agent cannot pre-write reward files; the verifier's output is downloaded from `simulator` instead.
    volumes: !override
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
      - ${HOST_ARTIFACTS_PATH}:${ENV_ARTIFACTS_PATH}
      - rpc:/rpc:ro
    depends_on:
      simulator:
        condition: service_healthy
  simulator:
    # The simulator image is built from the shared runtime folder of this hub checkout (runtimes/<name>).
    # The build checks that the folder's content digest equals ROBOHUB_RUNTIME_DIGEST, so this task (whose
    # own digest the registry pins) also pins the simulator it runs on. No fixed image tag: compose names the
    # image after the trial's project, so BenchFlow's per-trial cleanup never removes an image another trial
    # is using; repeat builds are served from the Docker build cache.
    build:
      context: "../../../../runtimes/behavior"
      dockerfile: Dockerfile
      args:
        ROBOHUB_RUNTIME_DIGEST: "sha256:ed6260be7a33eb35e97b3b891b0d922987b7665ef3c513d6ca5cda4d0ff03389"
    # This runtime's simulator runs on a remote GPU worker (remote_worker in hub.yaml): the episode server reaches it
    # over HTTPS, so this service keeps network access, and it reads the worker endpoints (URL, shared secret) from
    # the host file named by $ROBOUSE_BEHAVIOR_REMOTE, mounted read-only here only; the agent container never sees it.
    init: true
    volumes:
      - rpc:/rpc
      - episode:/episode
      # The verifier copies the episode video and camera images here after the agent has stopped.
      - ${HOST_ARTIFACTS_PATH}:/logs/artifacts
      - ${ROBOUSE_BEHAVIOR_REMOTE:?set ROBOUSE_BEHAVIOR_REMOTE to the BEHAVIOR worker endpoints file}:/run/robouse/remote.json:ro
    environment:
      ROBOUSE_BEHAVIOR_REMOTE: /run/robouse/remote.json
      # Chosen per run on the host ($ROBOUSE_ORACLE_TOKEN; unset means no token) and given only to the reference
      # solution (task.md oracle.env): unlocks privileged state in vision tasks. No token is stored in this package.
      ROBOUSE_ORACLE_TOKEN: "${ROBOUSE_ORACLE_TOKEN:-}"
      # The Robo Use task definition (task.md frontmatter); sim-entry writes it to a file for `robouse serve`.
      ROBOUSE_TASK_MD: |
        ---
        schema_version: '1.3'
        task:
          name: robouse/behavior-putting-away-toys
          description: Pick up all eight toy figures from the floors of the living room and the dining room and put each of them inside one of the two toy boxes (either box).
        metadata:
          source_benchmark: BEHAVIOR-1K (Li et al. 2022/2024), 2026 BEHAVIOR Challenge task list; OmniGibson 3.9.3 on Isaac Sim 5.1
          source_task: putting_away_toys
          suite: behavior
          behavior_scene: house_single_floor
          behavior_instance: 0
          behavior_challenge_task_id: 54
          challenge_instruction: Pick up all the toy figures from the floor and put them inside the toy boxes.
          category: household-long-horizon
          difficulty: hard
          language_instruction: Pick up all eight toy figures from the floors of the living room and the dining room and put each of them inside one of the two toy boxes (either box).
          tags:
          - behavior-1k
          - omnigibson
          - isaac-sim
          - r1pro
          - mobile-manipulation
          - symbolic-skills
          - remote-gpu
          - gpu-required
          requires_gpu: NVIDIA RTX GPU with RT cores, for the remote simulator worker
          reference_solution: scripted skill plan, 32 skills (oracle/plan.json)
        agent:
          timeout_sec: 1800
        verifier:
          timeout_sec: 120
        robouse:
          id: behavior-putting-away-toys
          backend: behavior
          env: putting_away_toys
          scene: house_single_floor
          rooms:
          - corridor_0
          - dining_room_0
          - entryway_0
          - garden_0
          - kitchen_0
          - living_room_0
          - living_room_1
          instance: 0
          seed: 0
          max_steps: 80
          camera: follow
          cameras:
          - follow
          - head
          skills: true
          success_mode: final
          obs_mode: state
          frame_every: 1
          linger_s: 5
          ready_timeout_s: 900
          rpc_timeout_s: 600
        ---
    command: ["robouse-sim-entry", "--max-wall-s", "2700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, stat, sys; sys.exit(0 if stat.S_ISSOCK(os.stat('/rpc/episode.sock').st_mode) else 1)"]
      interval: 1s
      timeout: 5s
      retries: 180
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
volumes:
  rpc: {}
  episode: {}
